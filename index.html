<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>GitHub Actions Status</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#25314a;--muted:#93a4c3;--text:#edf3ff;--blue:#8bb4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#17274a 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 20px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.04em;margin:5px 0}p{margin:6px 0;color:var(--muted)}button,.linkbtn{border:1px solid var(--line);background:#18243b;color:var(--text);padding:10px 14px;border-radius:12px;font:inherit;cursor:pointer;text-decoration:none}button:hover,.linkbtn:hover{border-color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:26px 0}.stat,.toolbar,.project{background:#121a2d;border:1px solid var(--line);border-radius:16px}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:27px;margin-top:4px}.toolbar{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{background:#0b1325;color:var(--text);border:1px solid var(--line);padding:10px 12px;border-radius:10px;font:inherit}.toolbar input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project{padding:17px;min-width:0}.project-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.repo{font-weight:750;font-size:17px;overflow-wrap:anywhere;color:var(--text);text-decoration:none}.repo:hover{color:var(--blue)}.badge{font-size:12px;font-weight:750;white-space:nowrap;padding:4px 9px;border-radius:99px;background:#263149;color:#c5d0e5}.success{background:#12392e;color:#8bf0c1}.failure{background:#48232d;color:#ffabb8}.running{background:#44351a;color:#ffda91}.neutral{background:#263149;color:#c5d0e5}.workflow{margin-top:14px;font-weight:650}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.small{font-size:12px;color:var(--muted);margin-top:20px}.error{color:#ffabb8}@media(max-width:680px){main{padding:24px 14px 40px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid{grid-template-columns:1fr}.stat{padding:13px}.stat strong{font-size:23px}}
</style></head><body><main>
<header class="top"><div><div class="eyebrow">Personal DevOps · Live overview</div><h1>Actions Status</h1><p>集中查看公開儲存庫的 GitHub Actions 執行狀況。</p></div><button id="refresh">↻ 重新載入</button></header>
<section class="stats"><div class="stat"><span>監控專案</span><strong id="total">－</strong></div><div class="stat"><span>成功</span><strong id="ok">－</strong></div><div class="stat"><span>失敗</span><strong id="bad">－</strong></div><div class="stat"><span>執行中</span><strong id="running">－</strong></div></section>
<section class="toolbar"><input id="search" type="search" placeholder="搜尋專案或 Workflow…" aria-label="搜尋專案"><select id="filter" aria-label="狀態篩選"><option value="all">所有狀態</option><option value="failure">失敗</option><option value="success">成功</option><option value="running">執行中</option><option value="other">其他</option></select><span id="updated" class="meta">讀取狀態中…</span></section>
<section id="projects" class="grid"><div class="empty">正在載入最近的執行紀錄…</div></section><p class="small">資料由 GitHub Actions 定期更新。點擊專案或「查看紀錄」可前往 GitHub；排程更新約每 10 分鐘一次。</p></main>
<script>
const $=id=>document.getElementById(id);let items=[];
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function bucket(s){if(s==='success')return 'success';if(['failure','timed_out','action_required'].includes(s))return 'failure';if(['in_progress','queued','requested','waiting'].includes(s))return 'running';return 'other'}
function label(s){return ({success:'成功',failure:'失敗',cancelled:'已取消',in_progress:'執行中',queued:'排隊中',requested:'等待中',waiting:'等待中',timed_out:'逾時',action_required:'需要處理',skipped:'已略過'}[s]||s||'尚無紀錄')}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const filtered=items.filter(x=>(!q||[x.name,x.workflow,x.branch].join(' ').toLowerCase().includes(q))&&(f==='all'||bucket(x.status)===f));$('total').textContent=items.length;$('ok').textContent=items.filter(x=>x.status==='success').length;$('bad').textContent=items.filter(x=>['failure','timed_out','action_required'].includes(x.status)).length;$('running').textContent=items.filter(x=>bucket(x.status)==='running').length;const wrap=$('projects');wrap.replaceChildren();if(!filtered.length){wrap.append(node('div','empty','沒有符合條件的專案。'));return}filtered.forEach(x=>{const card=node('article','project'),head=node('div','project-head'),repo=node('a','repo',x.name),badge=node('span','badge '+bucket(x.status),label(x.status));repo.href=x.html_url;repo.target='_blank';repo.rel='noopener noreferrer';head.append(repo,badge);card.append(head,node('div','workflow',x.workflow||'尚無 Workflow 執行紀錄'));const meta=node('div','meta','分支：'+(x.branch||'－')+' · '+(x.updated_at?new Date(x.updated_at).toLocaleString('zh-TW',{hour12:false}):'尚無執行紀錄'));card.append(meta);if(x.commit_message)card.append(node('p','',x.commit_message));const foot=node('div','foot'),extra=node('span','meta',(x.event||'')+(x.duration_seconds!=null?' · '+Math.floor(x.duration_seconds/60)+' 分 '+(x.duration_seconds%60)+' 秒':'')),link=node('a','linkbtn','查看紀錄 ↗');link.href=x.runs_url||x.html_url+'/actions';link.target='_blank';link.rel='noopener noreferrer';foot.append(extra,link);card.append(foot);wrap.append(card)})}
async function load(){$('refresh').disabled=true;$('refresh').textContent='載入中…';try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();items=data.repositories||[];$('updated').textContent='資料更新：'+(data.generated_at?new Date(data.generated_at).toLocaleString('zh-TW',{hour12:false}):'尚未更新');render()}catch(e){$('updated').textContent='讀取失敗，請稍後重試';if(!items.length){$('projects').replaceChildren(node('div','empty','目前尚無狀態資料。第一次排程執行後就會顯示專案。'))}}finally{$('refresh').disabled=false;$('refresh').textContent='↻ 重新載入'}}
$('refresh').addEventListener('click',load);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);load();
</script></body></html>
