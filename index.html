<!doctype html>
<html lang="zh-Hant" data-chi-theme="light" data-chi-theme-mode="system" data-chi-layout="header" data-chi-brand="status">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F8FA">
<title>Chi Status · 狀態總覽</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/47tsai/chi-system/2b8cd040116133a580bae0136794679fdafdaeb1/logo/status-w.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/47tsai/chi-system/2b8cd040116133a580bae0136794679fdafdaeb1/logo/status-w.png">
<script src="chi-system/theme.js"></script>
<script src="chi-system/icon.js"></script>
<link rel="stylesheet" href="chi-system/tokens.css">
<link rel="stylesheet" href="chi-system/components.css">
<link rel="stylesheet" href="shared.css">
<style>
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
:focus-visible{outline:var(--chi-focus-width) solid var(--chi-color-focus-ring);outline-offset:var(--chi-focus-offset)}
.skip{position:absolute;left:12px;top:-60px;z-index:50;padding:10px 14px;background:var(--chi-color-surface);border:1px solid var(--chi-color-border-subtle);border-radius:var(--chi-radius-md)}.skip:focus{top:12px}
.chi-header{position:sticky;top:0;z-index:20}
.page-heading{padding:27px 0 18px;border-bottom:1px solid var(--chi-color-border-subtle)}.heading-row{display:flex;align-items:flex-start;flex-direction:column;gap:15px}.eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 9px;color:var(--chi-color-text-muted);font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--chi-color-success)}.page-heading h1{margin:0;color:var(--chi-color-text-primary);letter-spacing:-.045em}.heading-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}.heading-actions .chi-btn{flex:1}.updated{margin-top:15px;color:var(--chi-color-text-muted);font-size:11px}.updated.stale{color:var(--chi-color-warning)}
.summary{display:flex;align-items:center;gap:10px;margin-top:22px;padding:14px 16px;border:1px solid var(--chi-color-border-subtle);border-radius:var(--chi-radius-lg);background:var(--chi-color-surface)}
.summary .dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--chi-color-success)}
.summary.bad .dot{background:var(--chi-color-danger)}
.summary.warn .dot{background:var(--chi-color-warning)}
.summary.running .dot{background:var(--chi-color-accent)}
.summary-text{font-size:15px;font-weight:700;color:var(--chi-color-text-primary)}
.summary-text small{display:block;margin-top:2px;font-size:12px;font-weight:500;color:var(--chi-color-text-muted)}
.notice{display:none;margin-top:12px;padding:12px 14px;border:1px solid var(--chi-color-border-subtle);border-radius:var(--chi-radius-md);background:var(--chi-color-surface);font-size:13px;overflow-wrap:anywhere}.notice:not(:empty){display:block}.notice.error{border-color:var(--chi-color-danger);color:var(--chi-color-danger)}
.monitors{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.monitor{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:13px 15px;border:1px solid var(--chi-color-border-subtle);border-radius:var(--chi-radius-lg);background:var(--chi-color-surface)}
.monitor .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--chi-color-success)}
.monitor[data-health=bad] .dot{background:var(--chi-color-danger)}
.monitor[data-health=warn] .dot{background:var(--chi-color-warning)}
.monitor[data-health=running] .dot{background:var(--chi-color-accent)}
.monitor .name{flex:1 1 160px;min-width:0;font-size:15px;font-weight:650;color:var(--chi-color-text-primary);overflow-wrap:anywhere}
.monitor .name a{color:inherit;text-decoration:none}.monitor .name a:hover{color:var(--chi-color-accent);text-decoration:underline}
.monitor .kind{font-size:11px;color:var(--chi-color-text-muted)}
.monitor .status{flex:none;font-size:12px;font-weight:650}
.monitor .status.good{color:var(--chi-color-success)}
.monitor .status.bad{color:var(--chi-color-danger)}
.monitor .status.warn{color:var(--chi-color-warning)}
.monitor .status.running{color:var(--chi-color-accent)}
.monitor .meta{flex:none;font-size:12px;color:var(--chi-color-text-muted);font-variant-numeric:tabular-nums}
#monitors>.chi-state{grid-column:1/-1}.chi-state .chi-spinner{margin:0 auto var(--chi-space-4)}
.chi-footer a{color:var(--chi-color-text-muted);text-decoration:none}.chi-footer a:hover{color:var(--chi-color-accent)}
a.chi-btn{text-decoration:none}
.chi-footer{flex-wrap:wrap}.chi-footer__version{white-space:nowrap}
@media(min-width:768px){.page-heading{padding:36px 0 22px}.heading-row{align-items:flex-end;flex-direction:row;gap:24px}.heading-actions{width:auto}.heading-actions .chi-btn{flex:none}.updated{font-size:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">跳至主要內容</a>
<div class="chi-shell"><div class="chi-content">
<header class="chi-header">
<a class="chi-header__brand" href="/" aria-label="Chi Status 狀態總覽首頁">
<img class="chi-header__logo chi-header__logo--light" src="https://raw.githubusercontent.com/47tsai/chi-system/2b8cd040116133a580bae0136794679fdafdaeb1/logo/status-b.png" alt="" width="32" height="32">
<img class="chi-header__logo chi-header__logo--dark" src="https://raw.githubusercontent.com/47tsai/chi-system/2b8cd040116133a580bae0136794679fdafdaeb1/logo/status-w.png" alt="" width="32" height="32">
<span class="chi-header__name">Chi Status</span>
</a>
<div class="chi-header__actions">
<button class="chi-header__theme" type="button" data-chi-theme-toggle aria-label="切換主題" title="切換主題"><span aria-hidden="true" data-chi-theme-icon>◐</span></button>
</div>
</header>
<nav class="chi-subnav" aria-label="本站導覽"><a href="#overview" aria-current="page">狀態總覽</a><a href="/action/">Actions 控制台</a><a href="https://github.com/47tsai/status" target="_blank" rel="noopener noreferrer">GitHub<span aria-hidden="true">↗</span></a></nav>
<main class="chi-main" id="main">
<section class="page-heading"><div class="heading-row"><div><p class="eyebrow"><span class="live-dot"></span> STATUS OVERVIEW</p><h1>狀態總覽</h1><p class="updated" id="updated" aria-live="polite">正在讀取最新狀態…</p></div><div class="heading-actions"><button class="chi-btn chi-btn--primary" id="refresh" type="button"><span id="refresh-icon" aria-hidden="true"></span><span id="refresh-label">重新整理</span></button><a class="chi-btn chi-btn--secondary" href="/action/">前往 Actions 控制台</a></div></div></section>
<div id="overview">
<div class="summary" id="summary" role="status"><span class="dot" aria-hidden="true"></span><div class="summary-text"><span id="summary-text">正在讀取最新狀態…</span><small id="summary-sub"></small></div></div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<ul class="monitors" id="monitors"><li class="chi-state" role="status"><div class="chi-spinner" aria-hidden="true"></div><p class="chi-state__title">正在載入狀態資料…</p></li></ul>
</div>
</main>
<footer class="chi-footer"><span class="chi-footer__name">Chi Status · 狀態總覽</span><span class="chi-footer__version" data-version></span><span><a href="/action/">Actions 控制台</a>　·　<a href="https://github.com/47tsai/status" target="_blank" rel="noopener noreferrer">GitHub</a></span></footer>
</div></div>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);let items=[],lastGeneratedAt=null,loading=false,loadError='';
const labels={success:'成功',failure:'失敗',cancelled:'已取消',in_progress:'執行中',queued:'排隊中',requested:'等待中',waiting:'等待中',timed_out:'逾時',action_required:'需要處理',skipped:'已略過',unknown:'狀態未知',running:'執行中'};
const kindLabels={dashboard:'監控儀表板',vps:'VPS 服務',claim:'自動領取',checkin:'自動簽到',source:'來源更新',deploy:'網站部署',freegame:'限免遊戲',website:'外部服務',project:'一般專案'};
const text=s=>String(s??'');const escapeHTML=s=>text(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isWorkflowBad=x=>['failure','timed_out','action_required','startup_failure'].includes(x.status);
const isBusinessBad=x=>x.business?.business_status==='failure';
const isRunning=x=>['in_progress','queued','requested','waiting'].includes(x.status);
const isWorkflowUnconfirmed=x=>x.status!=='success'&&!isWorkflowBad(x)&&!isRunning(x);
const label=s=>labels[s]||s||'尚無紀錄';
const safeDate=s=>{const d=new Date(s||0);return !s||Number.isNaN(d.getTime())?'尚無時間':d.toLocaleString('zh-TW',{hour12:false})};
function health(x){if(isWorkflowBad(x)||isBusinessBad(x))return'bad';if(isRunning(x))return'running';if(x.monitor_warning||isWorkflowUnconfirmed(x)||x.business?.business_status!=='success')return'warn';return'good'}
function statusText(x){if(isWorkflowBad(x))return'工作流程'+label(x.status);if(isBusinessBad(x))return'業務異常';if(x.monitor_warning)return'監控警告';if(isRunning(x))return label(x.status);if(isWorkflowUnconfirmed(x))return'工作流程'+label(x.status)+' · 待確認';if(x.business?.business_status==='success')return'業務正常';return'待確認'}
function responseTime(x){const m=(x.business&&x.business.metrics||[]).find(m=>m.label==='回應時間');return m?m.value:''}
function render(){
 const order={status:0,'vps-01':1,'vps-02':2,'sc-auto-claim':3,apktwsign:4,bahasign:5,'free-game':6,'chi-source':7,'chi-source-personal':8,'vaultwarden-service':9,'chi-auth-service':10,'chi-home':11,nav:12,merch:13,'sub-service':14,h:15};const severity=x=>isWorkflowBad(x)||isBusinessBad(x)?0:x.monitor_warning?1:isRunning(x)?1:(x.business?.business_status==='success'&&x.status==='success')?3:2;
 const sorted=items.slice().sort((a,b)=>(order[a.name]??100)-(order[b.name]??100)||severity(a)-severity(b)||(new Date(b.updated_at||0)-new Date(a.updated_at||0)));
 const bad=sorted.filter(x=>health(x)==='bad').length,warn=sorted.filter(x=>health(x)==='warn').length,running=sorted.filter(isRunning).length;
 const summary=$('summary');
 summary.className='summary'+(bad?' bad':warn?' warn':running?' running':'');
 $('summary-text').textContent=bad?bad+' 個項目異常':warn?warn+' 個項目需要留意':running?running+' 個項目執行中':'全部服務正常';
 $('summary-sub').textContent=sorted.length+' 個監控項目'+(running?' · '+running+' 個執行中':'');
 const root=$('monitors');root.replaceChildren();
 if(!sorted.length){root.innerHTML='<li class="chi-state"><p class="chi-state__title">目前沒有監控項目</p></li>';return}
 for(const x of sorted){const b=x.business||{},h=health(x),rt=responseTime(x);
  const li=document.createElement('li');li.className='monitor';li.dataset.health=h;
  const link=x.html_url?'<a href="'+escapeHTML(x.html_url)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(b.title||x.full_name||x.name)+'</a>':escapeHTML(b.title||x.full_name||x.name);
  li.innerHTML='<span class="dot" aria-hidden="true"></span><span class="name">'+link+'</span><span class="kind">'+escapeHTML(kindLabels[b.kind]||kindLabels.project)+'</span><span class="status '+h+'">'+escapeHTML(statusText(x))+'</span>'+(rt?'<span class="meta">'+escapeHTML(rt)+'</span>':'')+'<span class="meta">'+escapeHTML(safeDate(x.updated_at))+'</span>';
  root.append(li);
 }
}
function updateFreshness(){const stamp=$('updated');if(loadError){stamp.textContent=loadError;stamp.classList.add('stale');return}if(!lastGeneratedAt||Number.isNaN(lastGeneratedAt.getTime())){stamp.textContent='尚未取得有效的更新時間';stamp.classList.add('stale');return}const delta=Date.now()-lastGeneratedAt.getTime(),age=Math.max(0,Math.floor(delta/60000));let ageText=age<1?'不到 1 分鐘前':age+' 分鐘前';if(age>=20)ageText+=' · 資料可能過期';if(delta < -120000)ageText='時間戳記在未來，請檢查系統時間';stamp.textContent='資料更新時間：'+lastGeneratedAt.toLocaleString('zh-TW',{hour12:false})+' · '+ageText;stamp.classList.toggle('stale',age>=20||delta < -120000)}
async function load(){if(loading)return;loading=true;const btn=$('refresh');btn.disabled=true;$('refresh-label').textContent='讀取中…';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch('/status.json?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.repositories))throw Error('狀態資料格式不正確');items=data.repositories;lastGeneratedAt=data.generated_at?new Date(data.generated_at):null;loadError='';$('notice').textContent='';$('notice').className='notice';updateFreshness();render()}catch(e){loadError=e.name==='AbortError'?'讀取逾時：15 秒內未收到回應':'讀取失敗：'+e.message;updateFreshness();$('notice').className='notice error';$('notice').textContent='目前無法讀取最新狀態資料。請確認 status.json 已部署，或稍後重新整理。';if(!items.length)$('monitors').innerHTML='<li class="chi-state"><p class="chi-state__title">目前讀取不到狀態資料</p><p class="chi-state__desc">請稍後重新整理。</p></li>'}finally{clearTimeout(timeout);loading=false;btn.disabled=false;$('refresh-label').textContent='重新整理'}}
$('refresh').addEventListener('click',load);
var refreshIcon=$('refresh-icon');if(refreshIcon&&window.ChiIcon&&ChiIcon.icon){refreshIcon.innerHTML=ChiIcon.icon('fa-solid fa-rotate-right')}
setInterval(()=>{if(!document.hidden)load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(updateFreshness,15000);load();
</script>
</body>
</html>
