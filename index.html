<style>

.top{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#6fa8ff,#7c72ff);color:#fff;box-shadow:0 8px 25px #3d6dc633}.brand-mark svg{width:22px;height:22px}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--blue);text-transform:uppercase}h1{font-size:22px;letter-spacing:-.035em;font-weight:750;line-height:1.2;margin:2px 0 4px}.subtitle{margin:0;color:var(--muted);font-size:12px}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.page-nav{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.page-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:7px 13px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:650;text-decoration:none;white-space:nowrap}.page-nav a:hover{color:var(--text);background:var(--surface2)}.page-nav a[aria-current=page]{background:var(--surface3);color:var(--text);box-shadow:inset 0 0 0 1px #45618b}.header-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;transition:.15s}button:hover,.btn:hover{border-color:#5d8bd0;background:var(--surface2)}button:disabled{opacity:.6;cursor:wait}.button-icon{width:15px;height:15px;display:inline-block;vertical-align:middle;stroke-width:1.8}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:24px;margin:24px 0 17px;padding:25px 27px;border:1px solid #344b70;border-radius:18px;background:linear-gradient(110deg,#172b4a,#17243d 55%,#252b58);box-shadow:0 18px 45px #0002}.hero:after{content:"";position:absolute;width:270px;height:270px;right:4%;top:-180px;border:1px solid #91b9ff2e;border-radius:50%;box-shadow:0 0 0 28px #91b9ff0b,0 0 0 58px #91b9ff08;pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:600px}.hero-kicker{display:flex;align-items:center;gap:8px;color:#a9c8ff;font-size:10px;font-weight:800;letter-spacing:.15em}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #61d9ac1c}.hero h2{font-size:clamp(22px,3vw,29px);line-height:1.2;letter-spacing:-.04em;margin:10px 0 8px}.hero p{color:#b5c5de;font-size:13px;margin:0;max-width:530px}.hero-side{position:relative;z-index:1;min-width:145px;text-align:right}.hero-side .mini-label{font-size:10px;color:#a9bad5;letter-spacing:.1em}.hero-side strong{display:block;font-size:16px;margin-top:5px;color:#eaf2ff}.hero-side span{font-size:11px;color:#a9bad5}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 24px}.stat{position:relative;overflow:hidden;padding:17px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}.stat:after{content:"";position:absolute;right:-18px;top:-28px;width:78px;height:78px;border-radius:50%;background:var(--glow,#78aaff);opacity:.07}.stat:nth-child(1){--glow:#78aaff}.stat:nth-child(2){--glow:#61d9ac}.stat:nth-child(3){--glow:#ff7f8b}.stat:nth-child(4){--glow:#f6c76b}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:30px;line-height:1.2;letter-spacing:-.045em;margin-top:8px;font-weight:750;font-variant-numeric:tabular-nums}.stat:nth-child(2) strong{color:var(--green)}.stat:nth-child(3) strong{color:var(--red)}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:25px 0 12px}.section-heading h2{margin:0;font-size:16px;letter-spacing:-.02em}.section-heading p{margin:3px 0 0;color:var(--muted);font-size:11px}.section-caption{color:var(--muted);font-size:10px;letter-spacing:.12em}
.toolbar{display:grid;grid-template-columns:minmax(200px,1fr) minmax(175px,220px) auto;gap:9px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:14px}.toolbar input,.toolbar select{width:100%;min-width:0;min-height:41px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;font-size:12px}.toolbar input::placeholder{color:#7184a1}.toolbar .meta{grid-column:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.project{--accent:var(--blue);min-width:0;padding:18px;background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:15px;position:relative;transition:transform .16s,border-color .16s,box-shadow .16s}.project:hover{transform:translateY(-2px);border-color:#3c5274;box-shadow:0 14px 30px #0002}.project[data-kind=claim]{--accent:#e5ad63}.project[data-kind=freegame]{--accent:#a5cc83}.project[data-kind=checkin]{--accent:#61d9ac}.project[data-kind=deploy]{--accent:#78aaff}.project[data-kind=dashboard]{--accent:#b7a0ff}.project[data-kind=vps]{--accent:#e5ad63}.project[data-health=attention]{border-color:#713d50}.project[data-health=running]{border-color:#655333}
.project-head{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center}.project-head>.badges{grid-column:1/-1;margin:1px 0 0}.app-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--surface2);color:var(--accent);border:1px solid var(--line)}.app-svg{width:20px;height:20px;stroke-width:1.7}.title-wrap{min-width:0}.project-title{font-size:15px;font-weight:720;line-height:1.35;margin:0 0 4px;overflow-wrap:anywhere}.repo{display:block;font-size:11px;color:var(--muted);text-decoration:none;overflow-wrap:anywhere}.repo:hover{color:var(--blue)}
.badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0 0}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:7px;background:var(--surface3);color:#c6d5eb;font-size:10px;line-height:1.5;font-weight:650}.good{background:#123c35;color:#7fe4c0}.bad{background:#482633;color:#ffabb5}.running{background:#42361f;color:#f6d18a}.unknown{background:#26334a;color:#b4c5df}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}.metric{min-width:0;padding:10px 11px;background:var(--bg);border:1px solid #273650;border-radius:9px}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;font-size:13px;line-height:1.4;margin-top:4px;overflow-wrap:anywhere}.good-text{color:var(--green)}.bad-text{color:var(--red)}
.runline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.runmeta{font-size:10px;color:var(--muted);overflow-wrap:anywhere}.runmeta strong{color:var(--text);font-weight:600}.links{display:flex;gap:6px;flex-wrap:wrap}.links .btn{min-height:32px;padding:6px 9px;font-size:10px}details{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}summary{display:flex;align-items:center;gap:7px;cursor:pointer;list-style:none;font-size:11px;font-weight:650;color:var(--muted)}summary::-webkit-details-marker{display:none}.summary-icon{width:14px;height:14px;margin-left:auto;transition:transform .15s ease}details[open] .summary-icon{transform:rotate(180deg)}.detail-list{display:grid;gap:6px;margin-top:10px}.detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:var(--surface2);border-radius:7px;font-size:11px}.detail-row span{color:var(--muted)}.detail-row strong{text-align:right;overflow-wrap:anywhere}.note{font-size:11px;color:var(--muted);margin:10px 0 0}.monitor-warning{margin-top:12px;padding:10px 12px;border:1px solid #775b32;border-radius:9px;background:#352a1c;color:#ffdb9b;font-size:11px;overflow-wrap:anywhere}
.empty{padding:40px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;grid-column:1/-1;background:#111a2e66}.footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#updated.stale{color:var(--red);font-weight:700}
html[data-theme=light]{color-scheme:light;--bg:#f3f6fc;--surface:#fff;--surface2:#f0f4fb;--surface3:#e5edfb;--line:#dce4f0;--text:#18243a;--muted:#687991;--blue:#316fd4;--green:#168c68;--red:#c8465b;--amber:#a76c14;background:radial-gradient(ellipse at 12% 0%,#3568c214,transparent 34%),var(--bg)}
html[data-theme=light] .hero{background:linear-gradient(110deg,#e3edff,#eaf0ff 60%,#eeeaff);border-color:#d4e0f5}html[data-theme=light] .hero h2{color:#172a49}html[data-theme=light] .hero p,html[data-theme=light] .hero-side span,html[data-theme=light] .hero-side .mini-label{color:#5f7191}html[data-theme=light] .hero-side strong{color:#233b63}html[data-theme=light] .hero-kicker{color:#3567b1}html[data-theme=light] .project{background:#fff}html[data-theme=light] .project:hover{border-color:#b6c9e7}html[data-theme=light] .metric{background:#f7f9fd;border-color:#e7edf6}html[data-theme=light] .badge{background:#edf2fa;color:#4e607b}html[data-theme=light] .good{background:#e1f6ee;color:#147755}html[data-theme=light] .bad{background:#ffeaed;color:#b32f46}html[data-theme=light] .running{background:#fff2d8;color:#8a5a0a}html[data-theme=light] .unknown{background:#eaf0fa;color:#526785}html[data-theme=light] .monitor-warning{background:#fff6e5;border-color:#e8d09d;color:#80591a}html[data-theme=light] .empty{background:#ffffff99}
@media(max-width:850px){main{padding:22px 18px 42px}.top{align-items:flex-start}.top-actions{width:100%;justify-content:space-between}.hero{padding:22px}.stat{padding:14px}.grid{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:16px 12px 34px}.top{position:relative;gap:15px;padding-bottom:16px}.brand-mark{width:40px;height:40px;border-radius:12px}.brand{gap:10px;padding-right:48px}h1{font-size:20px}.top-actions{display:flex;flex-direction:column;align-items:stretch;gap:9px}.page-nav{width:100%}.page-nav a{flex:1}.header-tools{display:grid;grid-template-columns:1fr 1fr}.header-tools>*{width:100%}#themeToggle{position:absolute;top:0;right:0;width:40px;height:40px;min-height:40px;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box;z-index:3}#themeToggle .button-icon{display:block;flex:none;vertical-align:initial}#themeLabel{display:none}.hero{display:block;margin:17px 0 12px;padding:20px 18px;border-radius:14px}.hero h2{font-size:23px}.hero-side{margin-top:18px;padding-top:13px;border-top:1px solid #ffffff1e;text-align:left}.hero-side strong{display:inline-block;margin-right:8px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:20px;gap:8px}.stat{padding:13px;border-radius:12px}.stat strong{font-size:27px}.section-heading{align-items:flex-start;flex-direction:column;gap:3px;margin-top:20px}.toolbar{grid-template-columns:1fr;padding:9px;gap:8px}.toolbar .meta{white-space:normal}.project{padding:15px;border-radius:13px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.runline{align-items:flex-start;flex-direction:column}.links{width:100%}.links .btn{flex:1}.detail-row{align-items:flex-start;flex-direction:column;gap:3px}.detail-row strong{text-align:left}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<body><main>
<header class="top"><div class="brand"><div class="brand-mark"><i data-lucide="activity" aria-hidden="true"></i></div><div><div class="eyebrow">CHI · STATUS CENTER</div><h1>專案健康中心</h1><p class="subtitle">一個地方掌握服務、部署與自動化任務。</p></div></div><div class="top-actions"><nav class="page-nav" aria-label="Chi Status 導覽"><a href="./" aria-current="page">狀態總覽</a><a href="./actions.html">Actions 控制台</a></nav><div class="header-tools"><button id="themeToggle" type="button" aria-label="切換色彩模式"><span id="themeIcon" class="button-icon" aria-hidden="true"></span><span id="themeLabel">跟隨系統</span></button><a class="btn" href="https://github.com/tsai97216/status/actions" target="_blank" rel="noopener noreferrer"><i class="button-icon" data-lucide="history" aria-hidden="true"></i>執行紀錄</a><button id="refresh" type="button" title="重新讀取目前的狀態內容"><i class="button-icon" data-lucide="refresh-cw" aria-hidden="true"></i><span id="refreshLabel" aria-live="polite">重新整理</span></button></div></div></header>
<section class="hero"><div class="hero-copy"><div class="hero-kicker"><span class="live-dot"></span> PERSONAL OPERATIONS</div><h2>所有系統，一眼掌握。</h2><p>從工作流程到服務監控，把成功、執行中與需要處理的項目放在同一個清晰的視野裡。</p></div><div class="hero-side"><div class="mini-label">STATUS FEED</div><strong>自動更新中</strong><br><span>每分鐘重新讀取狀態資料</span></div></section>
<section class="stats" aria-label="狀態摘要"><div class="stat"><span>追蹤專案</span><strong id="total">－</strong></div><div class="stat"><span>業務成功</span><strong id="bizok">－</strong></div><div class="stat"><span>需要注意</span><strong id="attention">－</strong></div><div class="stat"><span>正在執行</span><strong id="runningCount">－</strong></div></section>
<div class="section-heading"><div><h2>追蹤中的專案</h2><p>依狀態篩選，快速找到需要關注的服務。</p></div><span class="section-caption">LIVE OVERVIEW</span></div>
<section class="toolbar"><input id="search" type="search" placeholder="搜尋專案、工作流程或業務結果…" aria-label="搜尋專案"><select id="filter" aria-label="狀態篩選"><option value="all">全部專案</option><option value="attention">需要注意</option><option value="business-failure">業務失敗</option><option value="workflow-failure">Workflow 失敗</option><option value="success">業務成功</option><option value="running">執行中</option><option value="deploy">網站與部署</option><option value="vps">VPS 主機</option></select><span id="updated" class="runmeta" role="status" aria-live="polite">讀取資料中…</span></section>
<section id="projects" class="grid"><div class="empty">正在載入專案資料…</div></section>

</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
const $=id=>document.getElementById(id);let items=[];let loading=false;let lastGeneratedAt=null;let loadError='';
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function iconNode(name,cls){const e=document.createElement("i");e.setAttribute("data-lucide",name);e.setAttribute("aria-hidden","true");if(cls)e.className=cls;const fallback={"layout-dashboard":"▦",server:"▤","gamepad-2":"⌘","circle-check":"✓",package:"▣",globe:"◎",activity:"⌁","external-link":"↗","refresh-cw":"↻","alert-triangle":"!","chevron-down":"⌄",monitor:"▣",sun:"☼",moon:"☾"};e.textContent=fallback[name]||"•";return e}
function renderIcons(){if(window.lucide&&typeof window.lucide.createIcons==="function")window.lucide.createIcons()}
function bucket(s){if(s==='success')return'good';if(['failure','timed_out','action_required','startup_failure'].includes(s))return'bad';if(['in_progress','queued','requested','waiting'].includes(s))return'running';return'unknown'}
function label(s){return({success:'成功',failure:'失敗',cancelled:'已取消',in_progress:'執行中',queued:'排隊中',requested:'等待中',waiting:'等待中',timed_out:'逾時',action_required:'需要處理',skipped:'已略過'}[s]||s||'尚無紀錄')}
function businessBucket(s){return s==='success'?'good':s==='failure'?'bad':s==='running'?'running':'unknown'}
function businessLabel(b){return b?.business_label||'尚未建立業務紀錄'}
function isWorkflowBad(x){return ['failure','timed_out','action_required','startup_failure'].includes(x.status)}
function isBusinessBad(x){return x.business?.business_status==='failure'}
function isRunning(x){return ['in_progress','queued','requested','waiting'].includes(x.status)}
function render(){
 const q=$('search').value.trim().toLowerCase(),f=$('filter').value;
 const filtered=items.filter(x=>{
  const b=x.business||{},hay=[x.name,x.workflow,x.branch,x.commit_message,x.monitor_warning,b.title,b.description,b.business_label,...(b.metrics||[]).flatMap(m=>[m.label,m.value])].join(' ').toLowerCase();
  if(q&&!hay.includes(q)&&!(b.details||[]).some(d=>[d.label,d.result,d.time].join(' ').toLowerCase().includes(q)))return false;
  if(f==='attention'&&!(isWorkflowBad(x)||isBusinessBad(x)||x.monitor_warning))return false;
  if(f==='business-failure'&&!isBusinessBad(x))return false;
  if(f==='workflow-failure'&&!isWorkflowBad(x))return false;
  if(f==='success'&&b.business_status!=='success')return false;
  if(f==='running'&&!isRunning(x))return false;
  if(f==='deploy'&&b.kind!=='deploy')return false;
  if(f==='vps'&&b.kind!=='vps')return false;
  return true;
 });
 const kindOrder={dashboard:0,vps:1,claim:2,checkin:3,source:4,deploy:5,freegame:6};
 const severity=x=>isWorkflowBad(x)||isBusinessBad(x)?0:x.monitor_warning?1:isRunning(x)?1:(x.business?.business_status==='success'&&x.status==='success')?3:2;
 filtered.sort((a,b)=>(kindOrder[a.business?.kind]??7)-(kindOrder[b.business?.kind]??7)||severity(a)-severity(b)||(new Date(b.updated_at||0)-new Date(a.updated_at||0)));
 $('total').textContent=items.length;
 $('bizok').textContent=items.filter(x=>x.business?.business_status==='success').length;
 $('attention').textContent=items.filter(x=>isWorkflowBad(x)||isBusinessBad(x)||x.monitor_warning).length;
 $('runningCount').textContent=items.filter(isRunning).length;
 const wrap=$('projects');wrap.replaceChildren();
 if(!filtered.length){wrap.append(node('div','empty','沒有符合條件的專案。'));renderIcons();return}
 filtered.forEach(x=>{
  const b=x.business||{},card=node('article','project');card.dataset.kind=b.kind||'generic';if(isWorkflowBad(x)||isBusinessBad(x)){card.dataset.health='attention';card.setAttribute('aria-label',(b.title||x.name)+'，需要注意')}else if(x.monitor_warning){card.dataset.health='warning';card.setAttribute('aria-label',(b.title||x.name)+'，監控資料有警告')}else if(isRunning(x)){card.dataset.health='running'}else{card.dataset.health='normal'}
  const head=node('div','project-head'),ico=node('div','app-icon'),tw=node('div','title-wrap');const iconNames={dashboard:'layout-dashboard',vps:'server',claim:'gamepad-2',freegame:'gamepad-2',checkin:'circle-check',source:'package',deploy:'globe',generic:'activity'};ico.append(iconNode(iconNames[b.kind]||iconNames.generic,'app-svg'));
  tw.append(node('h2','project-title',b.title||x.name));
  const repo=node('a','repo',x.full_name||x.name);repo.href=x.html_url;repo.target='_blank';repo.rel='noopener noreferrer';tw.append(repo);
  const badges=node('div','badges');badges.append(node('span','badge '+businessBucket(b.business_status),(b.kind==='vps'?'服務：':'業務：')+businessLabel(b)));badges.append(node('span','badge '+bucket(x.status),(b.kind==='vps'?'探測：':'Actions：')+label(x.status)));
  head.append(ico,tw,badges);card.append(head);
  const metrics=node('div','metrics');(b.metrics||[]).slice(0,3).forEach(m=>{const el=node('div','metric');el.append(node('span','',m.label||'指標'));const val=node('strong',m.tone==='good'?'good-text':m.tone==='bad'?'bad-text':'',m.value??'－');el.append(val);metrics.append(el)});if(metrics.childNodes.length)card.append(metrics);
  const runline=node('div','runline'),meta=node('div','runmeta');meta.append(node('span','',b.kind==='vps'?'監控方式：':'Workflow：'));meta.append(node('strong','',x.workflow||'尚無 Workflow'));meta.append(node('span','',' · '+(x.updated_at?new Date(x.updated_at).toLocaleString('zh-TW',{hour12:false}):'尚無時間')));runline.append(meta);
  const links=node('div','links'),runLink=node('a','btn');runLink.append(iconNode('external-link','button-icon'),document.createTextNode(b.kind==='vps'?'監控更新紀錄':'執行紀錄'));runLink.href=x.run_url||x.runs_url||x.html_url+'/actions';runLink.target='_blank';runLink.rel='noopener noreferrer';links.append(runLink);
  if(b.evidence_url){const evidence=node('a','btn');evidence.append(iconNode('external-link','button-icon'),document.createTextNode('業務證據'));evidence.href=b.evidence_url;evidence.target='_blank';evidence.rel='noopener noreferrer';links.append(evidence)}
  runline.append(links);card.append(runline);
  if(x.monitor_warning){const warning=node('div','monitor-warning');warning.append(iconNode('alert-triangle','button-icon'),document.createTextNode(x.monitor_warning));card.append(warning)}
  const det=node('details'),sum=node('summary','', '詳細資訊'),list=node('div','detail-list');sum.append(iconNode('chevron-down','summary-icon'));
  (b.details||[]).forEach(d=>{const row=node('div','detail-row');row.append(node('span','',d.label||'紀錄'));row.append(node('strong',d.tone==='good'?'good-text':d.tone==='bad'?'bad-text':'', [d.result,d.time&&d.time!=='尚無紀錄'?'時間：'+d.time:null].filter(Boolean).join(' · ')||'尚無資料'));list.append(row)});
  if(!list.childNodes.length)list.append(node('div','detail-row','尚無額外業務明細'));
  det.append(sum,list);if(b.note)det.append(node('p','note',b.note));card.append(det);wrap.append(card);
 });
  renderIcons();
}
async function load(){if(loading)return;loading=true;const btn=$('refresh');const controller=new AbortController();let timedOut=false;const timeout=setTimeout(()=>{timedOut=true;controller.abort()},15000);btn.disabled=true;$('refreshLabel').textContent='更新中…';try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.repositories))throw Error('狀態資料格式不正確');items=data.repositories;lastGeneratedAt=data.generated_at?new Date(data.generated_at):null;loadError='';updateFreshness();render()}catch(e){loadError=timedOut?'讀取逾時：15 秒內未收到回應':'讀取失敗：'+e.message;updateFreshness();if(!items.length)$('projects').replaceChildren(node('div','empty','目前讀取不到狀態資料，請稍後重試。'))}finally{clearTimeout(timeout);loading=false;btn.disabled=false;$('refreshLabel').textContent='重新整理'}}
function updateFreshness(){const el=$('updated');if(loadError){el.textContent=loadError;el.classList.add('stale');return}if(!lastGeneratedAt||Number.isNaN(lastGeneratedAt.getTime())){el.textContent='尚未取得有效的資料更新時間';el.classList.add('stale');return}const delta=Date.now()-lastGeneratedAt.getTime();const stamp=lastGeneratedAt.toLocaleString('zh-TW',{hour12:false});if(delta < -120000){el.textContent='資料更新：'+stamp+' · 時間戳記在未來，請檢查系統時間';el.classList.add('stale');return}const age=Math.max(0,Math.floor(delta/60000));el.textContent='資料更新：'+stamp+' · '+(age<1?'不到 1 分鐘前':age+' 分鐘前')+(age>=20?' · 資料可能過期':'');el.classList.toggle('stale',age>=20)}
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(updateFreshness,15000);
const themeToggle=$('themeToggle'),themeIcon=$('themeIcon'),themeLabel=$('themeLabel');
const themeModes=['system','light','dark'];
const themeNames={system:'跟隨系統',light:'淺色模式',dark:'深色模式'};
const systemTheme=window.matchMedia('(prefers-color-scheme: light)');
function setTheme(mode,save=false){
 const resolved=mode==='system'?(systemTheme.matches?'light':'dark'):mode;
 document.documentElement.dataset.theme=resolved;
 themeIcon.replaceChildren(iconNode(mode==='system'?'monitor':mode==='light'?'sun':'moon','button-icon'));renderIcons();
 themeLabel.textContent=themeNames[mode];
 themeToggle.setAttribute('aria-label','色彩模式：'+themeNames[mode]+'，點擊切換');
 themeToggle.title='色彩模式：'+themeNames[mode];
 document.querySelector('meta[name="theme-color"]').content=resolved==='light'?'#f5f6f8':'#0f1115';
 if(save){try{localStorage.setItem('chi-status-theme',mode)}catch(e){}}
}
let savedTheme='system';try{savedTheme=localStorage.getItem('chi-status-theme')||'system'}catch(e){}
if(!themeModes.includes(savedTheme))savedTheme='system';
let currentTheme=savedTheme;
setTheme(currentTheme);
themeToggle.addEventListener('click',()=>{currentTheme=themeModes[(themeModes.indexOf(currentTheme)+1)%themeModes.length];setTheme(currentTheme,true)});
systemTheme.addEventListener('change',()=>{if(currentTheme==='system')setTheme('system')});
$('refresh').addEventListener('click',load);
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);load();
</script></body></html>
