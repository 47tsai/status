<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090e1b">
<title>Chi Status · 專案健康中心</title>
<style>
:root{color-scheme:dark;--bg:#090e1b;--panel:#111a2b;--panel2:#0d1525;--line:#26354d;--muted:#92a5c3;--text:#edf4ff;--blue:#91baff;--green:#72e4b2;--red:#ff9cab;--amber:#ffd17d;--purple:#c4a7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% -8%,#20345c 0,transparent 42%),radial-gradient(ellipse at 95% 15%,#1c2943 0,transparent 30%),var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1240px;margin:auto;padding:30px 20px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.eyebrow{color:var(--blue);font-size:11px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,45px);line-height:1.1;letter-spacing:-.045em;margin:8px 0 10px}.subtitle{color:var(--muted);margin:0;max-width:670px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:1px solid var(--line);background:#18243a;color:var(--text);padding:10px 14px;border-radius:12px;font:inherit;text-decoration:none;cursor:pointer}button:hover,.btn:hover{border-color:var(--blue)}button:disabled{opacity:.65;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:25px 0 17px}.stat{padding:16px 17px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#152139,#101827)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:29px;letter-spacing:-.04em;margin-top:4px}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:16px;background:#0f1727;margin-bottom:14px}.toolbar input,.toolbar select{background:#090f1d;color:var(--text);border:1px solid var(--line);padding:10px 12px;border-radius:10px;font:inherit}.toolbar input{flex:1;min-width:190px}.toolbar .meta{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.project{--accent:var(--blue);position:relative;overflow:hidden;padding:17px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(150deg,#141f33,#0f1727 72%);min-width:0}.project:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.9}.project[data-kind="claim"]{--accent:#ffbe70}.project[data-kind="freegame"]{--accent:#a8e17d}.project[data-kind="checkin"]{--accent:#74e2c1}.project[data-kind="deploy"]{--accent:#91baff}.project[data-kind="dashboard"]{--accent:#c4a7ff}.project[data-kind="vps"]{--accent:#ffbd78}
.project-head{display:flex;align-items:flex-start;gap:12px}.app-icon{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,#111a2b);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:19px}.title-wrap{min-width:0;flex:1}.project-title{font-size:17px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}.repo{display:block;font-size:12px;color:var(--muted);text-decoration:none;margin-top:4px;overflow-wrap:anywhere}.repo:hover{color:var(--blue)}.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.badge{font-size:11px;font-weight:800;white-space:nowrap;padding:4px 8px;border-radius:99px;background:#253149;color:#c8d4e8}.good{background:#12372d;color:#8bf0c1}.bad{background:#48242e;color:#ffb1be}.running{background:#44351b;color:#ffdc91}.unknown{background:#263149;color:#c8d4e8}.desc{font-size:12px;color:var(--muted);margin:12px 0 13px}
.business-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 11px;background:#0b1322;border:1px solid #22314a;border-radius:12px}.business-line strong{font-size:13px}.business-line span{font-size:12px;color:var(--muted);text-align:right}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.metric{padding:10px;border-radius:12px;background:#111c2e;border:1px solid #202e45;min-width:0}.metric span{display:block;font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:14px;margin-top:4px;overflow-wrap:anywhere;line-height:1.35}.metric strong.good-text{color:var(--green)}.metric strong.bad-text{color:var(--red)}
.runline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid #26334a}.runmeta{font-size:12px;color:var(--muted)}.runmeta strong{color:#d9e5f8;font-weight:650}.links{display:flex;gap:7px;flex-wrap:wrap}.links .btn{padding:7px 10px;font-size:12px;border-radius:9px}
details{margin-top:11px;border-top:1px solid #26334a;padding-top:10px}summary{font-size:12px;color:var(--accent);font-weight:750;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"＋";float:right}details[open] summary:after{content:"−"}.detail-list{display:grid;gap:7px;margin-top:10px}.detail-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:8px 10px;background:#0b1322;border-radius:9px}.detail-row span{color:var(--muted)}.detail-row strong{text-align:right;overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted);margin:10px 0 0}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.footer{font-size:12px;color:var(--muted);margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.error{color:var(--red)}
@media(max-width:760px){main{padding:24px 13px 38px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.toolbar .meta{margin-left:0;width:100%}}
@media(max-width:430px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.project-head{gap:9px}.app-icon{width:37px;height:37px;flex-basis:37px}.badges{max-width:120px}.business-line{align-items:flex-start;flex-direction:column}.business-line span{text-align:left}}

/* Layout refinement: clearer hierarchy and a compact, predictable mobile layout. */
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.top{align-items:flex-end}
.top-actions{flex-shrink:0}
.stat{min-width:0}
.toolbar select{max-width:100%}
.project{display:flex;flex-direction:column}
.project-head{min-width:0}
.project-title{overflow-wrap:anywhere}
.badges{max-width:46%;min-width:0}
.badge{white-space:normal;line-height:1.4}
.business-line{min-width:0}
.business-line strong{overflow-wrap:anywhere}
.metric{min-height:67px}
.runmeta{overflow-wrap:anywhere}
@media(max-width:760px){
  main{padding:22px 14px 34px}
  .top{align-items:flex-start}
  .top>div:first-child{width:100%}
  .top-actions{width:100%}
  .top-actions .btn,.top-actions button{flex:1;text-align:center;justify-content:center}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));margin:20px 0 14px}
  .stat{padding:13px 14px}
  .stat strong{font-size:26px}
  .toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;padding:11px}
  .toolbar input,.toolbar select{width:100%;min-width:0}
  .toolbar .meta{width:100%;margin:0}
  .project{padding:15px}
  .badges{max-width:43%}
}
@media(max-width:430px){
  .grid{gap:10px}
  .project-head{display:grid;grid-template-columns:37px minmax(0,1fr);gap:9px}
  .app-icon{width:37px;height:37px;flex-basis:37px}
  .title-wrap{min-width:0}
  .badges{grid-column:1/-1;max-width:none;width:100%;justify-content:flex-start}
  .badge{font-size:10px}
  .project-title{font-size:16px}
  .desc{margin:10px 0 12px}
  .business-line{align-items:flex-start;flex-direction:column;gap:4px}
  .business-line span{text-align:left}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{padding:9px;min-height:62px}
  .runline{align-items:flex-start;flex-direction:column}
  .runline .links{width:100%}
  .runline .links .btn{flex:1;text-align:center}
  .detail-row{align-items:flex-start;flex-direction:column;gap:4px}
  .detail-row strong{text-align:left}
}
@media(prefers-reduced-motion:no-preference){
  button,.btn,.project{transition:border-color .18s ease,transform .18s ease}
  .project:hover{border-color:#3a4d6d}
}
</style>
</head>
<body><main>
<header class="top"><div><h1>專案健康中心</h1></div><div class="top-actions"><a class="btn" href="https://github.com/tsai97216/status/actions" target="_blank" rel="noopener noreferrer">更新紀錄 ↗</a><button id="refresh">↻ 重新整理</button></div></header>
<section class="stats"><div class="stat"><span>專案</span><strong id="total">－</strong></div><div class="stat"><span>成功</span><strong id="bizok">－</strong></div><div class="stat"><span>異常</span><strong id="attention">－</strong></div><div class="stat"><span>執行中</span><strong id="runningCount">－</strong></div></section>
<section class="toolbar"><input id="search" type="search" placeholder="搜尋專案、工作流程或業務結果…" aria-label="搜尋專案"><select id="filter" aria-label="狀態篩選"><option value="all">全部專案</option><option value="attention">需要注意</option><option value="business-failure">業務失敗</option><option value="workflow-failure">Workflow 失敗</option><option value="success">業務成功</option><option value="running">執行中</option><option value="deploy">網站與部署</option><option value="vps">VPS 主機</option></select><span id="updated" class="runmeta" role="status" aria-live="polite">讀取資料中…</span></section>
<section id="projects" class="grid"><div class="empty">正在載入專案資料…</div></section>

</main>
<script>
const $=id=>document.getElementById(id);let items=[];let loading=false;let lastGeneratedAt=null;
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function bucket(s){if(s==='success')return'good';if(['failure','timed_out','action_required'].includes(s))return'bad';if(['in_progress','queued','requested','waiting'].includes(s))return'running';return'unknown'}
function label(s){return({success:'成功',failure:'失敗',cancelled:'已取消',in_progress:'執行中',queued:'排隊中',requested:'等待中',waiting:'等待中',timed_out:'逾時',action_required:'需要處理',skipped:'已略過'}[s]||s||'尚無紀錄')}
function businessBucket(s){return s==='success'?'good':s==='failure'?'bad':s==='running'?'running':'unknown'}
function businessLabel(b){return b?.business_label||'尚未建立業務紀錄'}
function isWorkflowBad(x){return ['failure','timed_out','action_required'].includes(x.status)}
function isBusinessBad(x){return x.business?.business_status==='failure'}
function isRunning(x){return ['in_progress','queued','requested','waiting'].includes(x.status)}
function render(){
 const q=$('search').value.trim().toLowerCase(),f=$('filter').value;
 const filtered=items.filter(x=>{
  const b=x.business||{},hay=[x.name,x.workflow,x.branch,x.commit_message,b.title,b.description,b.business_label,...(b.metrics||[]).flatMap(m=>[m.label,m.value])].join(' ').toLowerCase();
  if(q&&!hay.includes(q))return false;
  if(f==='attention'&&!(isWorkflowBad(x)||isBusinessBad(x)))return false;
  if(f==='business-failure'&&!isBusinessBad(x))return false;
  if(f==='workflow-failure'&&!isWorkflowBad(x))return false;
  if(f==='success'&&b.business_status!=='success')return false;
  if(f==='running'&&!isRunning(x))return false;
  if(f==='deploy'&&b.kind!=='deploy')return false;
  if(f==='vps'&&b.kind!=='vps')return false;
  return true;
 });
 $('total').textContent=items.length;
 $('bizok').textContent=items.filter(x=>x.business?.business_status==='success').length;
 $('attention').textContent=items.filter(x=>isWorkflowBad(x)||isBusinessBad(x)).length;
 $('runningCount').textContent=items.filter(isRunning).length;
 const wrap=$('projects');wrap.replaceChildren();
 if(!filtered.length){wrap.append(node('div','empty','沒有符合條件的專案。'));return}
 filtered.forEach(x=>{
  const b=x.business||{},card=node('article','project');card.dataset.kind=b.kind||'generic';
  const head=node('div','project-head'),ico=node('div','app-icon',b.icon||'◉'),tw=node('div','title-wrap');
  tw.append(node('div','project-title',b.title||x.name));
  const repo=node('a','repo',x.full_name||x.name);repo.href=x.html_url;repo.target='_blank';repo.rel='noopener noreferrer';tw.append(repo);
  const badges=node('div','badges');badges.append(node('span','badge '+businessBucket(b.business_status),(b.kind==='vps'?'服務：':'業務：')+businessLabel(b)));badges.append(node('span','badge '+bucket(x.status),(b.kind==='vps'?'探測：':'Actions：')+label(x.status)));
  head.append(ico,tw,badges);card.append(head);
  const metrics=node('div','metrics');(b.metrics||[]).slice(0,3).forEach(m=>{const el=node('div','metric');el.append(node('span','',m.label||'指標'));const val=node('strong',m.tone==='good'?'good-text':m.tone==='bad'?'bad-text':'',m.value??'－');el.append(val);metrics.append(el)});if(metrics.childNodes.length)card.append(metrics);
  const runline=node('div','runline'),meta=node('div','runmeta');meta.append(node('span','',b.kind==='vps'?'監控方式：':'Workflow：'));meta.append(node('strong','',x.workflow||'尚無 Workflow'));meta.append(node('span','',' · '+(x.updated_at?new Date(x.updated_at).toLocaleString('zh-TW',{hour12:false}):'尚無時間')));runline.append(meta);
  const links=node('div','links'),runLink=node('a','btn',b.kind==='vps'?'監控更新紀錄 ↗':'執行紀錄 ↗');runLink.href=x.run_url||x.runs_url||x.html_url+'/actions';runLink.target='_blank';runLink.rel='noopener noreferrer';links.append(runLink);
  if(b.evidence_url){const evidence=node('a','btn','業務證據 ↗');evidence.href=b.evidence_url;evidence.target='_blank';evidence.rel='noopener noreferrer';links.append(evidence)}
  runline.append(links);card.append(runline);
  const det=node('details'),sum=node('summary','', '詳細資訊'),list=node('div','detail-list');
  (b.details||[]).forEach(d=>{const row=node('div','detail-row');row.append(node('span','',d.label||'紀錄'));row.append(node('strong',d.tone==='good'?'good-text':d.tone==='bad'?'bad-text':'', [d.result,d.time&&d.time!=='尚無紀錄'?'時間：'+d.time:null].filter(Boolean).join(' · ')||'尚無資料'));list.append(row)});
  if(!list.childNodes.length)list.append(node('div','detail-row','尚無額外業務明細'));
  det.append(sum,list);if(b.note)det.append(node('p','note',b.note));card.append(det);wrap.append(card);
 });
}
async function load(){if(loading)return;loading=true;const btn=$('refresh');btn.disabled=true;btn.textContent='讀取中…';try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();items=data.repositories||[];lastGeneratedAt=data.generated_at?new Date(data.generated_at):null;updateFreshness();render()}catch(e){$('updated').textContent='讀取失敗：'+e.message;if(!items.length)$('projects').replaceChildren(node('div','empty','目前讀取不到狀態資料，請稍後重試。'))}finally{loading=false;btn.disabled=false;btn.textContent='↻ 重新整理'}}
function updateFreshness(){const el=$('updated');if(!lastGeneratedAt){el.textContent='尚未取得資料更新時間';return}const age=Math.max(0,Math.floor((Date.now()-lastGeneratedAt.getTime())/60000));const stamp=lastGeneratedAt.toLocaleString('zh-TW',{hour12:false});el.textContent='資料更新：'+stamp+' · '+(age<1?'不到 1 分鐘前':age+' 分鐘前')+(age>=20?' · 資料可能過期':'')}
setInterval(()=>{if(!document.hidden)load()},60000);
setInterval(updateFreshness,15000);
$('refresh').addEventListener('click',load);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);load();
</script></body></html>
