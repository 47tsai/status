ackground:var(--chi-color-canvas)}.metric span{display:block;color:var(--chi-color-text-muted);font-size:10px;line-height:1.5}.metric strong{display:block;margin-top:4px;color:var(--chi-color-text-primary);font-size:12px;line-height:1.45;overflow-wrap:anywhere}.metric strong.good{color:var(--chi-color-success)}.metric strong.bad{color:var(--chi-color-danger)}.warning{margin-top:12px;padding:10px 12px;border-left:3px solid var(--chi-color-warning);background:var(--chi-color-surface-sunken);color:var(--chi-color-warning);font-size:12px;overflow-wrap:anywhere}.note{margin:12px 0 0;color:var(--chi-color-text-secondary);font-size:12px;line-height:1.7}.details{margin-top:12px;border-top:1px solid var(--chi-color-border-subtle);padding-top:9px}.details summary{cursor:pointer;color:var(--chi-color-text-secondary);font-size:12px;font-weight:650}.detail-list{display:grid;gap:0;margin-top:8px}.detail-row{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-bottom:1px solid var(--chi-color-border-subtle);font-size:12px}.detail-row:last-child{border-bottom:0}.detail-row span{color:var(--chi-color-text-muted)}.detail-row strong{text-align:left;color:var(--chi-color-text-secondary);font-weight:500;overflow-wrap:anywhere}.card-footer{display:flex;align-items:flex-start;flex-direction:column;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--chi-color-border-subtle)}.run-meta{min-width:0;color:var(--chi-color-text-muted);font-size:11px;overflow-wrap:anywhere}.links{display:flex;gap:7px;flex:none;width:100%}.links .chi-btn{flex:1}

<section class="page-heading"><div class="heading-row"><div><p class="eyebrow"><span class="live-dot"></span> STATUS OVERVIEW</p><h1>狀態總覽</h1><p class="intro">查看工作流程執行結果、服務與網站可用性，以及專案業務狀態。</p><p class="updated" id="updated" aria-live="polite">正在讀取最新狀態…</p></div><div class="heading-actions"><button class="chi-btn chi-btn--primary" id="refresh" type="button"><span id="refresh-icon" aria-hidden="true"></span><span id="refresh-label">重新整理</span></button><a class="chi-btn chi-btn--secondary" href="/action/">前往 Actions 控制台</a></div></div></section>

<div class="stat"><span class="stat-label">業務正常</span><strong class="stat-value" id="bizok">－</strong><span class="stat-note">業務狀態正常</span></div>
<div class="stat"><span class="stat-label">需要留意</span><strong class="stat-value" id="attention">－</strong><span class="stat-note">工作流程、業務異常或監控警告</span></div>
<div class="stat"><span class="stat-label">執行中</span><strong class="stat-value" id="running">－</strong><span class="stat-note">排隊中或執行中的工作流程</span></div>
</section>
<section class="section" aria-labelledby="projects-heading"><div class="section-head"><div><h2 id="projects-heading">監控項目</h2><p>每 10 分鐘自動更新一次狀態資料。</p></div><span class="result-count" id="result-count">載入中</span></div>
<div class="filters"><input class="chi-input" id="search" type="search" placeholder="搜尋專案、狀態、分支或紀錄…" aria-label="搜尋監控項目"><select class="chi-select" id="filter" aria-label="依狀態篩選"><option value="all">所有狀態</option><option value="attention">需要留意</option><option value="business-failure">業務異常</option><option value="workflow-failure">工作流程失敗</option><option value="success">業務正常</option><option value="running">執行中</option></select><select class="chi-select" id="category" aria-label="依類型篩選"><option value="all">所有類型</option><option value="vps">VPS</option><option value="claim">自動領取</option><option value="checkin">自動簽到</option><option value="source">來源更新</option><option value="deploy">網站部署</option><option value="freegame">限免遊戲</option><option value="website">外部服務</option></select><button class="chi-btn chi-btn--secondary" id="clear" type="button">清除篩選</button></div>

</div></div>
<script>
const $=id=>document.getElementById(id);let items=[],lastGeneratedAt=null,loading=false,loadError='';
const labels={success:'成功',failure:'失敗',cancelled:'已取消',in_progress:'執行中',queued:'排隊中',requested:'等待中',waiting:'等待中',timed_out:'逾時',action_required:'需要處理',skipped:'已略過',unknown:'狀態未知',running:'執行中'};
const kindLabels={dashboard:'監控儀表板',vps:'VPS 服務',claim:'自動領取',checkin:'自動簽到',source:'來源更新',deploy:'網站部署',freegame:'限免遊戲',website:'外部服務',project:'一般專案'};
const text=s=>String(s??'');const escapeHTML=s=>text(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isWorkflowBad=x=>['failure','timed_out','action_required','startup_failure'].includes(x.status);
const isBusinessBad=x=>x.business?.business_status==='failure';
const isRunning=x=>['in_progress','queued','requested','waiting'].includes(x.status);
const isWorkflowUnconfirmed=x=>x.status!=='success'&&!isWorkflowBad(x)&&!isRunning(x);
const needsAttention=x=>health(x)==='bad'||health(x)==='warn';
const label=s=>labels[s]||s||'尚無紀錄';
const safeDate=s=>{const d=new Date(s||0);return !s||Number.isNaN(d.getTime())?'尚無時間':d.toLocaleString('zh-TW',{hour12:false})};
const businessLabel=b=>b?.business_label||'尚未建立業務紀錄';
function health(x){if(isWorkflowBad(x)||isBusinessBad(x))return'bad';if(isRunning(x))return'running';if(x.monitor_warning||isWorkflowUnconfirmed(x)||x.business?.business_status!=='success')return'warn';return'good'}
function statusText(x){if(isWorkflowBad(x))return'工作流程'+label(x.status);if(isBusinessBad(x))return'業務異常';if(x.monitor_warning)return'監控警告';if(isRunning(x))return label(x.status);if(isWorkflowUnconfirmed(x))return'工作流程'+label(x.status)+' · 待確認';if(x.business?.business_status==='success')return'業務正常';return'待確認'}
function statusClass(x){const h=health(x);return h==='good'?'good':h==='bad'?'bad':h==='running'?'running':'warn'}
function render(){
 const q=$('search').value.trim().toLowerCase(),f=$('filter').value,c=$('category').value;
 const filtered=items.filter(x=>{const b=x.business||{},hay=[x.name,x.full_name,x.workflow,x.branch,x.commit_message,x.monitor_warning,b.title,b.description,b.business_label,...(b.metrics||[]).flatMap(m=>[m.label,m.value]),...(b.details||[]).flatMap(d=>[d.label,d.result,d.time])].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(f==='attention'&&!needsAttention(x))return false;if(f==='business-failure'&&!isBusinessBad(x))return false;if(f==='workflow-failure'&&!isWorkflowBad(x))return false;if(f==='success'&&health(x)!=='good')return false;if(f==='running'&&!isRunning(x))return false;if(c!=='all'&&b.kind!==c)return false;return true});
 const order={status:0,'vps-01':1,'sc-auto-claim':2,apktwsign:3,bahasign:4,'free-game':5,'chi-source':6,'chi-source-personal':7,'vaultwarden-service':8,'chi-auth-service':9,'chi-home':10,nav:11,merch:12,'sub-service':13,h:14};const severity=x=>isWorkflowBad(x)||isBusinessBad(x)?0:x.monitor_warning?1:isRunning(x)?1:(x.business?.business_status==='success'&&x.status==='success')?3:2;
 filtered.sort((a,b)=>(order[a.name]??100)-(order[b.name]??100)||severity(a)-severity(b)||(new Date(b.updated_at||0)-new Date(a.updated_at||0)));
 $('total').textContent=items.length;$('bizok').textContent=items.filter(x=>x.business?.business_status==='success').length;$('attention').textContent=items.filter(x=>health(x)==='bad'||health(x)==='warn').length;$('running').textContent=items.filter(isRunning).length;$('result-count').textContent='顯示 '+filtered.length+' / '+items.length+' 個項目';
 const root=$('projects');root.replaceChildren();
 if(!filtered.length){root.innerHTML='<div class="chi-state"><p class="chi-state__title">沒有符合條件的監控項目</p><p class="chi-state__desc">請調整搜尋文字或篩選條件。</p></div>';return}
 for(const x of filtered){const b=x.business||{},metrics=b.metrics||[],details=b.details||[],h=health(x);const card=document.createElement('article');card.className='project';card.dataset.health=h;
 const metricHTML=metrics.length?'<div class="metrics">'+metrics.map(m=>'<div class="metric"><span>'+escapeHTML(m.label)+'</span><strong class="'+(m.tone==='good'?'good':m.tone==='bad'?'bad':'')+'">'+escapeHTML(m.value)+'</strong></div>').join('')+'</div>':'';
 const detailHTML=details.length?'<details class="details"><summary>查看檢查細節（'+details.length+'）</summary><div class="detail-list">'+details.map(d=>'<div class="detail-row"><span>'+escapeHTML(d.label)+'</span><strong>'+escapeHTML([d.result,d.time].filter(Boolean).join(' · ')||'－')+'</strong></div>').join('')+'</div></details>':'';
 const note=b.note?'<p class="note">'+escapeHTML(b.note)+'</p>':'';
 const warning=x.monitor_warning?'<div class="warning">'+escapeHTML(x.monitor_warning)+'</div>':'';
 const duration=Number.isFinite(x.duration_seconds)?' · '+x.duration_seconds+' 秒':'';
 const runMeta='<div class="run-meta">'+escapeHTML(x.branch||'－')+' · '+escapeHTML(safeDate(x.updated_at))+duration+'</div>';
 const link=(url,label)=>url?'<a class="chi-btn chi-btn--sm chi-btn--secondary" href="'+escapeHTML(url)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>':'';
 card.innerHTML='<div class="project-top"><div class="project-title"><h3>'+escapeHTML(b.title||x.full_name||x.name)+'</h3><p>'+escapeHTML(b.description||x.workflow||'專案狀態')+'</p></div><span class="status '+statusClass(x)+'">'+escapeHTML(statusText(x))+'</span></div><div class="meta"><span class="tag">'+escapeHTML(kindLabels[b.kind]||kindLabels.project)+'</span><span class="tag">'+escapeHTML(x.workflow||'無工作流程紀錄')+'</span><span class="tag">Actions 執行：'+escapeHTML(label(x.status))+'</span></div>'+metricHTML+warning+note+detailHTML+'<div class="card-footer">'+runMeta+'<div class="links">'+link(x.html_url,'專案')+link(x.run_url||x.runs_url,'執行紀錄')+(b.evidence_url?link(b.evidence_url,'業務紀錄'):'')+'</div></div>';
 root.append(card);
 }
}
function updateFreshness(){const stamp=$('updated');if(loadError){stamp.textContent=loadError;stamp.classList.add('stale');return}if(!lastGeneratedAt||Number.isNaN(lastGeneratedAt.getTime())){stamp.textContent='尚未取得有效的更新時間';stamp.classList.add('stale');return}const delta=Date.now()-lastGeneratedAt.getTime(),age=Math.max(0,Math.floor(delta/60000));let ageText=age<1?'不到 1 分鐘前':age+' 分鐘前';if(age>=20)ageText+=' · 資料可能過期';if(delta < -120000)ageText='時間戳記在未來，請檢查系統時間';stamp.textContent='資料更新時間：'+lastGeneratedAt.toLocaleString('zh-TW',{hour12:false})+' · '+ageText;stamp.classList.toggle('stale',age>=20||delta < -120000)}
async function load(){if(loading)return;loading=true;const btn=$('refresh');btn.disabled=true;$('refresh-label').textContent='讀取中…';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch('/status.json?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.repositories))throw Error('狀態資料格式不正確');items=data.repositories;lastGeneratedAt=data.generated_at?new Date(data.generated_at):null;loadError='';$('notice').textContent='';$('notice').className='notice';updateFreshness();render()}catch(e){loadError=e.name==='AbortError'?'讀取逾時：15 秒內未收到回應':'讀取失敗：'+e.message;updateFreshness();$('notice').className='notice error';$('notice').textContent='目前無法讀取最新狀態資料。請確認 status.json 已部署，或稍後重新整理。';if(!items.length)$('projects').innerHTML='<div class="chi-state"><p class="chi-state__title">目前讀取不到狀態資料</p><p class="chi-state__desc">請稍後重新整理。</p></div>'}finally{clearTimeout(timeout);loading=false;btn.disabled=false;$('refresh-label').textContent='重新整理'}}
$('refresh').addEventListener('click',load);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('category').addEventListener('change',render);$('clear').addEventListener('click',()=>{$('search').value='';$('filter').value='all';$('category').value='all';render()});
function syncThemeColor(e){var d=e&&e.detail?e.detail.effective:document.documentElement.getAttribute('data-chi-theme');var meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=d==='dark'?'#131519':'#F7F8FA'}syncThemeColor();window.addEventListener('chi-theme-change',syncThemeColor);
async function loadVersion(){try{var r=await fetch('/version.json',{cache:'no-store'});if(!r.ok)return;var d=await r.json();var el=document.querySelector('[data-version]');if(!el||typeof d.version!=='string'||!d.version)return;el.textContent='v'+d.version+(typeof d.commit==='string'&&d.commit?' · '+d.commit.slice(0,7):'')}catch(e){}}
loadVersion();
var refreshIcon=$('refresh-icon');if(refreshIcon&&window.ChiIcon&&ChiIcon.icon){refreshIcon.innerHTML=ChiIcon.icon('fa-solid fa-rotate-right')}
setInterval(()=>{if(!document.hidden)load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(updateFreshness,15000);load();
</script>
