/* Actions console components, aligned with the main status dashboard */
.page-heading .heading-row{align-items:flex-end}
.heading-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.heading-actions .button{white-space:nowrap}
.auth-required[hidden]{display:none!important}
.console-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:30px}
.console-toolbar .section-head{margin:0}
.console-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;padding:12px;border:1px solid var(--chi-color-border);border-radius:var(--chi-radius-lg);background:var(--chi-color-surface)}
.console-count{color:var(--chi-color-text-muted);font-size:12px;font-variant-numeric:tabular-nums}
.actions-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;padding:12px;border:1px solid var(--chi-color-border);border-radius:var(--chi-radius-lg);background:var(--chi-color-surface)}
#act-message{display:none;white-space:pre-line;margin-top:12px;padding:12px 14px;border:1px solid var(--chi-color-border);border-radius:var(--chi-radius-md);background:var(--chi-color-surface);font-size:13px;overflow-wrap:anywhere}
#act-message:not(:empty){display:block}
#act-message[data-kind=error]{border-color:var(--chi-color-danger);color:var(--chi-color-danger)}
#act-message[data-kind=ok]{border-color:var(--chi-color-success);color:var(--chi-color-success)}
#act-workflows{margin-top:16px}
.workflow-group{margin-top:26px}
.workflow-group:first-child{margin-top:0}
.group-heading{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.group-title{margin:0;color:var(--chi-color-text-strong);font-size:17px;letter-spacing:-.02em}
.group-count{padding:3px 8px;border:1px solid var(--chi-color-border);border-radius:6px;color:var(--chi-color-text-subtle);font-size:11px}
.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;min-width:0;padding:17px;border:1px solid var(--chi-color-border);border-radius:var(--chi-radius-lg);background:var(--chi-color-surface);box-shadow:var(--chi-shadow-subtle)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.name{color:var(--chi-color-text-strong);font-size:16px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.repo{margin-top:4px;color:var(--chi-color-text-muted);font-size:11px;overflow-wrap:anywhere}
.group{flex:none;padding:3px 7px;border:1px solid var(--chi-color-border);border-radius:5px;color:var(--chi-color-text-muted);font-size:10px}
.fields{display:grid;gap:12px;margin-top:15px}
.field{display:flex;flex-direction:column;gap:5px}
.workflow-field label{color:var(--chi-color-text-muted);font-size:12px;font-weight:650}
.workflow-field input,.workflow-field select{width:100%;min-width:0;min-height:42px;padding:9px 11px;border:1px solid var(--chi-color-border-strong);border-radius:var(--chi-radius-md);background:var(--chi-color-page);color:var(--chi-color-text);font-size:13px}
.check{display:flex;align-items:center;gap:9px;color:var(--chi-color-text-muted);font-size:12px}
.check input{width:16px;height:16px;accent-color:var(--chi-color-accent)}
.warning{margin-top:12px;padding:10px 12px;border-left:3px solid var(--chi-color-warning);background:var(--chi-color-page-soft);color:var(--chi-color-warning);font-size:12px;overflow-wrap:anywhere}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:14px}
.fields .foot{margin-top:2px;border-top:1px solid var(--chi-color-border)}
.hint{color:var(--chi-color-text-subtle);font-size:11px}
.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.actions .btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 10px;border:1px solid var(--chi-color-border-strong);border-radius:var(--chi-radius-md);background:var(--chi-color-surface);color:var(--chi-color-text);font-size:11px;font-weight:650;text-decoration:none;cursor:pointer}
.actions .btn:hover{border-color:var(--chi-color-accent);background:var(--chi-color-surface-muted)}
.actions button.btn{font:inherit;font-size:11px}
.actions button:not(.btn){min-height:34px;padding:6px 10px;border:1px solid var(--chi-color-accent);border-radius:var(--chi-radius-md);background:var(--chi-color-accent);color:#071a36;font-size:11px;font-weight:700;cursor:pointer}
.actions button:disabled{opacity:.6;cursor:wait}
.empty{grid-column:1/-1;padding:36px 16px;border:1px dashed var(--chi-color-border-strong);border-radius:var(--chi-radius-lg);background:var(--chi-color-surface);color:var(--chi-color-text-muted);text-align:center}
@media(max-width:900px){.group-grid{gap:10px}.card{padding:14px}}
@media(max-width:620px){
 .page-heading{padding:27px 0 18px}
 .page-heading .heading-row{align-items:flex-start;flex-direction:column;gap:15px}
 main{padding-top:18px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stat{padding:13px 14px}
 .stat:nth-child(3){border-left:0;border-top:1px solid var(--chi-color-border)}
 .stat:nth-child(4){border-top:1px solid var(--chi-color-border)}
 .stat-value{font-size:26px}
 .console-toolbar{align-items:flex-start;flex-direction:column;gap:7px;margin-top:24px}
 .console-actions{align-items:flex-start;flex-direction:column}
 .actions-toolbar{display:grid;width:100%;grid-template-columns:1fr;gap:8px}
 .actions-toolbar .button{width:100%;min-height:44px;flex:none}
 .console-count{line-height:1.6}
 .console-actions{padding:12px}
 .toolbar{padding:9px}
 .group-grid{grid-template-columns:1fr}
 .head{gap:8px}
 .foot{align-items:flex-start;flex-direction:column}
 .actions{width:100%}
 .actions .btn,.actions button{flex:1}
}

<main id="main"><div class="container">
<section class="console-toolbar auth-required" id="act-workflow-heading" aria-labelledby="actions-heading"><div class="section-head"><div><h2 id="actions-heading">工作流程</h2><p>搜尋、篩選並執行已核准的自動化任務。</p></div><span class="result-count" id="act-count" role="status">尚未登入</span></div></section>
<div class="console-actions" aria-label="控制台操作"><span class="console-count">需要登入後才能載入工作流程。</span><div class="actions-toolbar"><button class="button" id="act-reload" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4.9 9A8 8 0 0 1 18.5 6L20 12M4 17v-5h5"/><path d="M19.1 15A8 8 0 0 1 5.5 18L4 12"/></svg>重新載入</button><button class="button primary" id="act-authLogin" type="button">使用 Chi Auth 登入</button><button class="button" id="act-authLogout" type="button" hidden>結束本次登入</button></div></div>
<section class="toolbar auth-required" id="act-workflow-filters" aria-label="工作流程搜尋"><input class="field" id="act-search" type="search" placeholder="搜尋專案、工作流程或類型…" aria-label="搜尋專案、工作流程或類型"></section>
<div id="act-message" role="status" aria-live="polite"></div>
<section class="auth-required" id="act-workflows" aria-label="工作流程清單" hidden><div class="empty">請先使用 Chi Auth 登入。</div></section>
</div></main>
<footer class="footer"><div class="container footer-inner"><span>Chi Status · Actions 控制台</span></div></footer>

<script>
const root=document.documentElement,systemTheme=window.matchMedia('(prefers-color-scheme: dark)');let theme='system';try{theme=localStorage.getItem('chi-status-theme')||'system'}catch(e){}if(!['system','light','dark'].includes(theme))theme='system';function applyTheme(){root.dataset.chiTheme=theme==='system'?(systemTheme.matches?'dark':'light'):theme;const themeButton=document.getElementById('theme');themeButton.innerHTML=(root.dataset.chiTheme==='dark'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>')+'<span class="label">外觀</span>';themeButton.setAttribute('aria-label','目前色彩模式：'+(theme==='system'?'跟隨系統':theme==='light'?'淺色':'深色')+'，點擊切換');const meta=document.querySelector('meta[name=theme-color]');meta.content=root.dataset.chiTheme==='dark'?'#17191f':'#f6f8fc'}applyTheme();document.getElementById('theme').addEventListener('click',()=>{theme=['system','light','dark'][(['system','light','dark'].indexOf(theme)+1)%3];try{localStorage.setItem('chi-status-theme',theme)}catch(e){}applyTheme()});systemTheme.addEventListener('change',()=>{if(theme==='system')applyTheme()});
document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('nav').classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open));document.getElementById('menu').setAttribute('aria-label',open?'關閉導覽選單':'開啟導覽選單')});document.addEventListener('click',e=>{if(!e.target.closest('#nav')&&!e.target.closest('#menu')){document.getElementById('nav').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}});

</script>
<script>(function(){

const API_URL = "https://chi-status-trigger.tsai97216.workers.dev";
const AUTH_URL = "https://auth.chi.qzz.io";
const CLIENT_ID = "DZT0NzjdlmwxReZ47kOVdNVV42YOtCV1";
const REDIRECT_URI = "https://status.chi.qzz.io/actions/";
const $ = id => document.getElementById("act-" + id);
let workflows = [];
let busy = false;
let accessToken = null;
let accessTokenExpiresAt = 0;

function syncAuthUI(authenticated) {
  for (const id of ["workflow-heading", "workflow-filters", "workflows"]) {
    const el = $(""+id);
    if (el) el.hidden = !authenticated;
  }
}

function message(text, kind="") {
  const el = $("message");
  el.textContent = text;
  el.dataset.kind = kind;
}
function base64url(value) {
  return btoa(String.fromCharCode(...new Uint8Array(value)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}
function randomVerifier() {
  return base64url(crypto.getRandomValues(new Uint8Array(32)));
}
async function beginAuth() {
  const verifier = randomVerifier();
  const challenge = base64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = randomVerifier();
  sessionStorage.setItem("chi-status-auth-pkce", JSON.stringify({ verifier, state, createdAt: Date.now() }));
  const params = new URLSearchParams({
    response_type: "code",
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    code_challenge: challenge,
    code_challenge_method: "S256",
    state
  });
  location.assign(AUTH_URL + "/api/authorize?" + params.toString());
}
async function finishAuthCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  if (!code && !returnedState) return false;
  history.replaceState(null, "", location.pathname + location.hash);
  let pending;
  try { pending = JSON.parse(sessionStorage.getItem("chi-status-auth-pkce") || "null"); } catch {}
  sessionStorage.removeItem("chi-status-auth-pkce");
  if (!code || !returnedState || !pending || pending.state !== returnedState ||
      !Number.isFinite(pending.createdAt) || Date.now() - pending.createdAt > 5 * 60 * 1000) {
    throw new Error("登入回呼驗證失敗或已逾時，請重新登入。");
  }
  const response = await fetch(AUTH_URL + "/api/token?client_id=" + encodeURIComponent(CLIENT_ID), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    cache: "no-store",
    body: JSON.stringify({
      client_id: CLIENT_ID,
      code,
      redirect_uri: REDIRECT_URI,
      code_verifier: pending.verifier
    })
  });
  const tokenData = await response.json().catch(() => ({}));
  if (!response.ok || !tokenData.access_token) throw new Error(tokenData.error || "無法完成 Chi Auth 授權碼交換。");
  const identityResponse = await fetch(AUTH_URL + "/api/userinfo?client_id=" + encodeURIComponent(CLIENT_ID), {
    headers: { Authorization: "Bearer " + tokenData.access_token },
    cache: "no-store"
  });
  if (!identityResponse.ok) throw new Error("Chi Auth 身分確認失敗，請重新登入。");
  const identity = await identityResponse.json();
  if (identity.sub !== "chi-owner" || identity.aud !== CLIENT_ID) throw new Error("Chi Auth 回傳的身分或應用識別不符。");
  accessToken = tokenData.access_token;
  accessTokenExpiresAt = Date.now() + Number(tokenData.expires_in || 0) * 1000;
  syncAuthUI(true);
  $("authLogin").hidden = true;
  $("authLogout").hidden = false;
  const authState = document.getElementById("act-auth-state"); if (authState) authState.textContent = "已登入";
  message("已透過 Chi Auth 完成 Passkey 身分驗證。", "ok");
  return true;
}
async function api(path, options={}) {
  if (!API_URL) throw new Error("API 網址尚未設定。");
  if (!accessToken || Date.now() >= accessTokenExpiresAt) {
    accessToken = null;
    syncAuthUI(false);
    $("authLogin").hidden = false;
    $("authLogout").hidden = true;
    throw new Error("登入已失效，請重新使用 Chi Auth 登入。");
  }
  const response = await fetch(API_URL + path, {
    ...options,
    headers: { Authorization: "Bearer " + accessToken, ...(options.headers || {}) },
    cache: "no-store"
  });
  let data = {};
  try { data = await response.json(); } catch {}
  if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}
function create(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}
function workflowUrl(item) {
  return `https://github.com/${item.repository}/actions/workflows/${encodeURIComponent(item.workflow)}`;
}
function render() {
  const query = $("search").value.trim().toLowerCase();
  const visible = workflows.filter(item => {
    const haystack = [item.name, item.repository, item.workflow, item.group].join(" ").toLowerCase();
    return !query || haystack.includes(query);
  });
  const groupOrder = {"Status 維護":0,"來源更新":1,"內容更新":2,"自動化":3,"驗證":4,"部署":5,"暫不可觸發":6,"外部監控":7};
  visible.sort((a,b) => (groupOrder[a.group] ?? 99) - (groupOrder[b.group] ?? 99) || Number(a.available === false) - Number(b.available === false) || a.name.localeCompare(b.name, "zh-Hant"));
  $("count").textContent = `${visible.length} / ${workflows.length} 項`;
  const totalEl = document.getElementById("act-total");
  const availableEl = document.getElementById("act-available");
  const unavailableEl = document.getElementById("act-unavailable");
  if (totalEl) totalEl.textContent = workflows.length;
  if (availableEl) availableEl.textContent = workflows.filter(item => item.available !== false).length;
  if (unavailableEl) unavailableEl.textContent = workflows.filter(item => item.available === false).length;
  const root = $("workflows");
  root.replaceChildren();
  if (!visible.length) {
    root.append(create("div", "empty", "沒有符合條件的工作流程。"));
    return;
  }
  const groupTotals = new Map();
  for (const item of visible) {
    const name = item.group || "其他";
    groupTotals.set(name, (groupTotals.get(name) || 0) + 1);
  }
  let activeGroup = null;
  let activeGrid = null;
  for (const item of visible) {
    const groupName = item.group || "其他";
    if (groupName !== activeGroup) {
      activeGroup = groupName;
      const section = create("section", "workflow-group");
      const heading = create("div", "group-heading");
      const groupTotal = groupTotals.get(groupName) || 0;
      heading.append(create("h2", "group-title", groupName), create("span", "group-count", `${groupTotal} 項`));
      activeGrid = create("div", "group-grid");
      section.append(heading, activeGrid);
      root.append(section);
    }
    const card = create("article", "card");
    const head = create("div", "head");
    const info = create("div");
    info.append(create("div", "name", item.name), create("div", "repo", `${item.repository} · ${item.workflow}`));
    head.append(info, create("span", "group", item.group || "其他"));
    card.append(head);
    if (item.available === false) {
      card.append(create("div", "warning", item.reason || "目前無法從控制台觸發。"));
      const foot = create("div", "foot");
      foot.append(create("span", "hint", "僅供狀態參考"));
      if (item.repository.startsWith("tsai97216/")) {
        const link = create("a", "btn", "查看專案");
        link.href = `https://github.com/${item.repository}/actions`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        foot.append(link);
      } else {
        const link = create("a", "btn", "查看狀態總覽");
        link.href = "../";
        foot.append(link);
      }
      card.append(foot);
      activeGrid.append(card);
      continue;
    }
    if (item.danger) card.append(create("div", "warning", item.danger));
    const form = create("form", "fields");
    for (const spec of item.inputs || []) {
      const wrap = create("div", "workflow-field");
      const id = "f-" + item.repository.replace(/[^a-z0-9]/gi,"-") + "-" + item.workflow.replace(/[^a-z0-9]/gi,"-") + "-" + spec.name;
      if (spec.type === "boolean") {
        const label = create("label", "check");
        const input = create("input");
        input.type = "checkbox";
        input.name = spec.name;
        input.checked = spec.default === true;
        label.append(input, document.createTextNode(spec.label + (spec.required ? "（必填）" : "")));
        wrap.append(label);
      } else {
        const label = create("label", "", spec.label + (spec.required ? "（必填）" : ""));
        label.htmlFor = id;
        let input;
        if (spec.type === "choice") {
          input = create("select");
          for (const option of spec.options || []) {
            const opt = create("option", "", option);
            opt.value = option;
            input.append(opt);
          }
          input.value = spec.default || (spec.options || [])[0] || "";
        } else {
          input = create("input");
          input.type = "text";
          input.value = spec.default || "";
          input.placeholder = spec.required ? "請填寫必要參數" : "可留空";
        }
        input.id = id;
        input.name = spec.name;
        input.required = !!spec.required;
        wrap.append(label, input);
      }
      form.append(wrap);
    }
    const foot = create("div", "foot");
    foot.append(create("span", "hint", "分支：main"));
    const buttons = create("div", "actions");
    const history = create("a", "btn", "執行紀錄");
    history.href = workflowUrl(item);
    history.target = "_blank";
    history.rel = "noopener noreferrer";
    const run = create("button", "", "立即觸發");
    run.type = "submit";
    buttons.append(history, run);
    foot.append(buttons);
    form.append(foot);
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;
      const inputs = {};
      for (const spec of item.inputs || []) {
        const field = form.elements.namedItem(spec.name);
        if (spec.type === "boolean") inputs[spec.name] = field.checked;
        else if (field.value !== "") inputs[spec.name] = field.value;
      }
      const confirmText = item.danger ? `確認執行「${item.name}」？\n\n${item.danger}\n\n此操作會使用 main 分支。` : `確認觸發「${item.name}」？`;
      if (!confirm(confirmText)) return;
      busy = true;
      run.disabled = true;
      run.textContent = "提交中…";
      message(`正在提交：${item.repository} / ${item.workflow}`);
      try {
        const result = await api("", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ repository: item.repository, workflow: item.workflow, ref: "main", inputs })
        });
        message(`GitHub 已接受觸發請求：${result.repository} / ${result.workflow}\n這不代表工作流程已成功完成，請開啟「執行紀錄」查看結果。`, "ok");
      } catch (error) {
        message(`觸發失敗：${error.message}`, "error");
      } finally {
        busy = false;
        run.disabled = false;
        run.textContent = "立即觸發";
      }
    });
    card.append(form);
    activeGrid.append(card);
  }
}
async function load() {
  $("reload").disabled = true;
  if (!accessToken || Date.now() >= accessTokenExpiresAt) {
    syncAuthUI(false);
    workflows = [];
    $("workflows").replaceChildren(create("div", "empty", "請先使用 Chi Auth 登入，驗證身分後才能查看及觸發工作流程。"));
    $("count").textContent = "尚未登入";
    message("請使用 Chi Auth 的 Passkey 登入。");
    $("reload").disabled = false;
    return;
  }
  $("reload").disabled = true;
  message("正在讀取狀態總覽專案清單…");
  try {
    const data = await api("?action=catalog");
    workflows = data.workflows || [];
    message("");
    render();
  } catch (error) {
    $("workflows").replaceChildren(create("div", "empty", "無法載入工作流程清單。"));
    message(error.message, "error");
    $("count").textContent = "載入失敗";
  } finally {
    $("reload").disabled = false;
  }
}

$("reload").addEventListener("click", load);
$("search").addEventListener("input", render);
$("authLogin").addEventListener("click", async () => {
  $("authLogin").disabled = true;
  try { await beginAuth(); } catch (error) { message("無法開始登入：" + error.message, "error"); $("authLogin").disabled = false; }
});
$("authLogout").addEventListener("click", () => {
  accessToken = null;
  accessTokenExpiresAt = 0;
  syncAuthUI(false);
  workflows = [];
  $("authLogin").hidden = false;
  $("authLogin").disabled = false;
  $("authLogout").hidden = true;
  $("workflows").replaceChildren(create("div", "empty", "已結束本次登入。"));
  $("count").textContent = "尚未登入";
  const authState = document.getElementById("act-auth-state"); if (authState) authState.textContent = "未登入";
  message("已清除本頁的存取權杖。再次操作時需要重新使用 Chi Auth 登入。", "ok");
});
(async () => {
  try {
    const completed = await finishAuthCallback();
    if (!completed) {
      syncAuthUI(false);
      $("authLogin").hidden = false;
      $("authLogout").hidden = true;
      message("請使用 Chi Auth 的 Passkey 登入後再管理工作流程。");
    }
  } catch (error) {
    message("登入失敗：" + error.message, "error");
  }
  await load();
})();

})();
</script>
</body>
