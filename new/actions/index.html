enter;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:13px;margin-top:15px}.foot .btn,.foot button{font-size:10px;min-height:33px;padding:6px 10px}.foot .actions{gap:6px}.empty{padding:38px;border:1px dashed var(--border-strong);border-radius:14px;text-align:center;color:var(--muted);background:var(--surface)}

<body>
<a class="skip" href="#workflows">跳至工作流程清單</a>
<main>
  <header class="top"><div class="brand"><div class="brand-mark"><i data-lucide="workflow" aria-hidden="true"></i></div><div><div class="eyebrow">CHI · STATUS CENTER</div><h1>Actions 控制台</h1><p class="sub">集中管理狀態總覽追蹤的自動化工作流程。</p></div></div><div class="top-actions"><nav class="page-nav" aria-label="Chi Status 導覽"><a href="../">狀態總覽</a><a href="./" aria-current="page">Actions 控制台</a></nav><div class="header-tools"><button id="themeToggle" type="button" aria-label="切換色彩模式"><span id="themeIcon" class="button-icon" aria-hidden="true"></span><span id="themeLabel">跟隨系統</span></button><button id="reload" type="button"><i class="button-icon" data-lucide="refresh-cw" aria-hidden="true"></i>重新載入清單</button><button id="forget" type="button"><i class="button-icon" data-lucide="key-round" aria-hidden="true"></i>清除授權金鑰</button></div></div></header>
  <section class="hero"><div class="hero-copy"><div class="hero-kicker"><span class="live-dot"></span> CHI · STATUS</div><h2>Actions 控制台</h2><p>選擇工作流程、填寫必要參數，並查看執行紀錄。</p></div></section>
  <section class="toolbar"><input id="search" type="search" placeholder="搜尋專案或工作流程…" aria-label="搜尋"><select id="group" aria-label="依類型篩選"><option value="">全部類型</option></select><span id="count" class="hint">讀取中…</span></section>
  <div id="message" role="status" aria-live="polite"></div>
  <section id="workflows" class="grid"><div class="empty">正在讀取工作流程清單…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
const API_URL = "https://chi-status-trigger.tsai97216.workers.dev";
const KEY_STORAGE = "chi-status-trigger-key";
const $ = id => document.getElementById(id);
let workflows = [];
let busy = false;

function message(text, kind="") {
  const el = $("message");
  el.textContent = text;
  el.dataset.kind = kind;
}
function getKey() {
  let key = "";
  try { key = localStorage.getItem(KEY_STORAGE) || ""; } catch {}
  if (!key) {
    key = prompt("請輸入 Status Worker 的 TRIGGER_SECRET：") || "";
    key = key.trim();
    if (key) {
      try { localStorage.setItem(KEY_STORAGE, key); } catch {}
    }
  }
  return key;
}
async function api(path, options={}) {
  if (!API_URL) throw new Error("API 網址尚未設定。請先部署 Worker，並把網址填入 actions.html 的 API_URL。");
  const key = getKey();
  if (!key) throw new Error("未輸入授權金鑰。");
  const response = await fetch(API_URL + path, {
    ...options,
    headers: { "X-Trigger-Key": key, ...(options.headers || {}) }
  });
  let data = {};
  try { data = await response.json(); } catch {}
  if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}
function create(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}
function workflowUrl(item) {
  return `https://github.com/${item.repository}/actions/workflows/${encodeURIComponent(item.workflow)}`;
}
function render() {
  const query = $("search").value.trim().toLowerCase();
  const group = $("group").value;
  const visible = workflows.filter(item => {
    const haystack = [item.name, item.repository, item.workflow, item.group].join(" ").toLowerCase();
    return (!query || haystack.includes(query)) && (!group || item.group === group);
  });
  const groupOrder = {"Status 維護":0,"來源更新":1,"內容更新":2,"自動化":3,"驗證":4,"部署":5,"暫不可觸發":6,"外部監控":7};
  visible.sort((a,b) => (groupOrder[a.group] ?? 99) - (groupOrder[b.group] ?? 99) || Number(a.available === false) - Number(b.available === false) || a.name.localeCompare(b.name, "zh-Hant"));
  $("count").textContent = `${visible.length} / ${workflows.length} 項`;
  const root = $("workflows");
  root.replaceChildren();
  if (!visible.length) {
    root.append(create("div", "empty", "沒有符合條件的工作流程。"));
    return;
  }
  let activeGroup = null;
  let activeGrid = null;
  for (const item of visible) {
    const groupName = item.group || "其他";
    if (groupName !== activeGroup) {
      activeGroup = groupName;
      const section = create("section", "workflow-group");
      const heading = create("div", "group-heading");
      const groupTotal = visible.filter(entry => (entry.group || "其他") === groupName).length;
      heading.append(create("h2", "group-title", groupName), create("span", "group-count", `${groupTotal} 項`));
      activeGrid = create("div", "group-grid");
      section.append(heading, activeGrid);
      root.append(section);
    }
    const card = create("article", "card");
    const head = create("div", "head");
    const info = create("div");
    info.append(create("div", "name", item.name), create("div", "repo", `${item.repository} · ${item.workflow}`));
    head.append(info, create("span", "group", item.group || "其他"));
    card.append(head);
    if (item.available === false) {
      card.append(create("div", "warning", item.reason || "目前無法從控制台觸發。"));
      const foot = create("div", "foot");
      foot.append(create("span", "hint", "僅供狀態參考"));
      if (item.repository.startsWith("tsai97216/")) {
        const link = create("a", "btn", "查看專案");
        link.href = `https://github.com/${item.repository}/actions`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        foot.append(link);
      } else {
        const link = create("a", "btn", "查看狀態總覽");
        link.href = "../";
        foot.append(link);
      }
      card.append(foot);
      activeGrid.append(card);
      continue;
    }
    if (item.danger) card.append(create("div", "warning", item.danger));
    const form = create("form", "fields");
    for (const spec of item.inputs || []) {
      const wrap = create("div", "field");
      const id = "f-" + item.repository.replace(/[^a-z0-9]/gi,"-") + "-" + item.workflow.replace(/[^a-z0-9]/gi,"-") + "-" + spec.name;
      if (spec.type === "boolean") {
        const label = create("label", "check");
        const input = create("input");
        input.type = "checkbox";
        input.name = spec.name;
        input.checked = spec.default === true;
        label.append(input, document.createTextNode(spec.label + (spec.required ? "（必填）" : "")));
        wrap.append(label);
      } else {
        const label = create("label", "", spec.label + (spec.required ? "（必填）" : ""));
        label.htmlFor = id;
        let input;
        if (spec.type === "choice") {
          input = create("select");
          for (const option of spec.options || []) {
            const opt = create("option", "", option);
            opt.value = option;
            input.append(opt);
          }
          input.value = spec.default || (spec.options || [])[0] || "";
        } else {
          input = create("input");
          input.type = "text";
          input.value = spec.default || "";
          input.placeholder = spec.required ? "請填寫必要參數" : "可留空";
        }
        input.id = id;
        input.name = spec.name;
        input.required = !!spec.required;
        wrap.append(label, input);
      }
      form.append(wrap);
    }
    const foot = create("div", "foot");
    foot.append(create("span", "hint", "分支：main"));
    const buttons = create("div", "actions");
    const history = create("a", "btn", "執行紀錄");
    history.href = workflowUrl(item);
    history.target = "_blank";
    history.rel = "noopener noreferrer";
    const run = create("button", "", "立即觸發");
    run.type = "submit";
    buttons.append(history, run);
    foot.append(buttons);
    form.append(foot);
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;
      const inputs = {};
      for (const spec of item.inputs || []) {
        const field = form.elements.namedItem(spec.name);
        if (spec.type === "boolean") inputs[spec.name] = field.checked;
        else if (field.value !== "") inputs[spec.name] = field.value;
      }
      const confirmText = item.danger ? `確認執行「${item.name}」？\n\n${item.danger}\n\n此操作會使用 main 分支。` : `確認觸發「${item.name}」？`;
      if (!confirm(confirmText)) return;
      busy = true;
      run.disabled = true;
      run.textContent = "提交中…";
      message(`正在提交：${item.repository} / ${item.workflow}`);
      try {
        const result = await api("", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ repository: item.repository, workflow: item.workflow, ref: "main", inputs })
        });
        message(`GitHub 已接受觸發請求：${result.repository} / ${result.workflow}\n這不代表工作流程已成功完成，請開啟「執行紀錄」查看結果。`, "ok");
      } catch (error) {
        message(`觸發失敗：${error.message}`, "error");
      } finally {
        busy = false;
        run.disabled = false;
        run.textContent = "立即觸發";
      }
    });
    card.append(form);
    activeGrid.append(card);
  }
}
async function load() {
  $("reload").disabled = true;
  message("正在讀取狀態總覽專案清單…");
  try {
    const data = await api("?action=catalog");
    workflows = data.workflows || [];
    const groups = [...new Set(workflows.map(item => item.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
    const select = $("group");
    select.replaceChildren(create("option", "", "全部類型"));
    select.firstChild.value = "";
    for (const name of groups) {
      const option = create("option", "", name);
      option.value = name;
      select.append(option);
    }
    message("");
    render();
  } catch (error) {
    $("workflows").replaceChildren(create("div", "empty", "無法載入工作流程清單。"));
    message(error.message, "error");
    $("count").textContent = "載入失敗";
  } finally {
    $("reload").disabled = false;
  }
}

function themeIconNode(name) {
  const el = document.createElement("i");
  el.className = "button-icon";
  el.setAttribute("aria-hidden", "true");
  el.setAttribute("data-lucide", name);
  return el;
}
function renderThemeIcon() {
  if (window.lucide && typeof window.lucide.createIcons === "function") window.lucide.createIcons();
}
const themeToggle = $("themeToggle"), themeIcon = $("themeIcon"), themeLabel = $("themeLabel");
const themeModes = ["system", "light", "dark"];
const themeNames = { system: "跟隨系統", light: "淺色模式", dark: "深色模式" };
const systemTheme = window.matchMedia("(prefers-color-scheme: light)");
function setTheme(mode, save=false) {
  const resolved = mode === "system" ? (systemTheme.matches ? "light" : "dark") : mode;
  document.documentElement.dataset.theme = resolved;
  themeIcon.replaceChildren(themeIconNode(mode === "system" ? "monitor" : mode === "light" ? "sun" : "moon"));
  renderThemeIcon();
  themeLabel.textContent = themeNames[mode];
  themeToggle.setAttribute("aria-label", "色彩模式：" + themeNames[mode] + "，點擊切換");
  themeToggle.title = "色彩模式：" + themeNames[mode];
  document.querySelector('meta[name="theme-color"]').content = resolved === "light" ? "#f5f6f8" : "#0f1115";
  if (save) { try { localStorage.setItem("chi-status-theme", mode); } catch {} }
}
let currentTheme = "system";
try { currentTheme = localStorage.getItem("chi-status-theme") || "system"; } catch {}
if (!themeModes.includes(currentTheme)) currentTheme = "system";
setTheme(currentTheme);
themeToggle.addEventListener("click", () => {
  currentTheme = themeModes[(themeModes.indexOf(currentTheme) + 1) % themeModes.length];
  setTheme(currentTheme, true);
});
systemTheme.addEventListener("change", () => { if (currentTheme === "system") setTheme("system"); });

$("reload").addEventListener("click", load);
$("search").addEventListener("input", render);
$("group").addEventListener("change", render);
$("forget").addEventListener("click", () => {
  try { localStorage.removeItem(KEY_STORAGE); } catch {}
  message("已清除此瀏覽器儲存的授權金鑰。", "ok");
});
load();
</script>
</body>
</html>
