name: Update Actions status
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: update-actions-status
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out status dashboard
        uses: actions/checkout@v4
      - name: Collect public repository workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          OWNER = "tsai97216"
          TOKEN = os.environ.get("GH_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "tsai97216-status-dashboard",
          }
          if TOKEN:
              headers["Authorization"] = "Bearer " + TOKEN

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          repos = []
          for page in range(1, 4):
              batch = get_json(f"https://api.github.com/users/{OWNER}/repos?type=public&per_page=100&page={page}&sort=updated")
              repos.extend(r for r in batch if not r.get("fork", False) and not r.get("archived", False))
              if len(batch) < 100:
                  break

          results = []
          for repo in repos:
              full_name = repo["full_name"]
              try:
                  data = get_json(f"https://api.github.com/repos/{full_name}/actions/runs?per_page=1")
                  runs = data.get("workflow_runs", [])
                  if not runs:
                      continue
                  run = runs[0]
                  duration = None
                  if run.get("run_started_at") and run.get("status") == "completed":
                      start = datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
                      end = datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
                      duration = max(0, int((end - start).total_seconds()))
                  results.append({
                      "name": repo["name"],
                      "full_name": full_name,
                      "html_url": repo["html_url"],
                      "workflow": run.get("name") or run.get("display_title") or "GitHub Actions",
                      "status": run.get("conclusion") if run.get("status") == "completed" else run.get("status"),
                      "branch": run.get("head_branch"),
                      "updated_at": run.get("updated_at") or run.get("created_at"),
                      "event": run.get("event"),
                      "commit_message": (run.get("head_commit") or {}).get("message", "").splitlines()[0][:180],
                      "duration_seconds": duration,
                      "runs_url": repo["html_url"] + "/actions",
                      "run_url": run.get("html_url"),
                  })
              except urllib.error.HTTPError as e:
                  print(f"Skipping {full_name}: HTTP {e.code}")
              except Exception as e:
                  print(f"Skipping {full_name}: {e}")

          results.sort(key=lambda x: x.get("updated_at") or "", reverse=True)
          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "repository_count": len(results),
              "repositories": results,
          }
          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Collected latest workflow runs for {len(results)} repositories.")
          PY
      - name: Commit updated status data
        run: |
          if git diff --quiet -- status.json; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "chore: update Actions status data"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest dashboard
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
