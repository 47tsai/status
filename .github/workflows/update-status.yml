name: Update Actions status
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/update-status.yml"
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: update-actions-status
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out status dashboard
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect workflow and business status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_status.py
      - name: Commit updated status data
        run: |
          if git diff --quiet -- status.json; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "chore: update project business status"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest dashboard
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
