name: Update Actions status
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "action/index.html"
      - "actions/index.html"
      - "CNAME"
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-status.yml"
permissions:
  contents: read
concurrency:
  group: update-actions-status
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    steps:
      - name: Check out latest status dashboard
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          html = Path("action/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script\\s*>", html, re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit("No inline scripts found in action/index.html")
          for index, script in enumerate(scripts, start=1):
              path = Path(f"/tmp/chi-status-inline-{index}.js")
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Syntax checked {len(scripts)} inline scripts.")
          PY
      - name: Test Discord alert logic
        run: python -m unittest discover -s tests -v
      - name: Collect workflow and business status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_status.py
      - name: Notify Discord about new project failures
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py
      - name: Commit updated status data
        run: |
          if git diff --quiet -- status.json alert-state.json; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json alert-state.json
          git commit -m "chore: update project business status"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out latest dashboard
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-workflow-failure:
    if: ${{ failure() }}
    needs: [update, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Notify Discord about workflow failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_RESULT: ${{ needs.update.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured; skipping Discord failure notification."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          failed = []
          for name in ("update", "deploy"):
              result = os.environ.get(name.upper() + "_RESULT", "unknown")
              if result not in ("success", "skipped"):
                  failed.append(f"- {name}: {result}")
          content = (
              "**Chi Status 工作流程失敗**\n"
              f"Repo：{os.environ.get('REPOSITORY', 'unknown')}\n"
              f"Workflow：{os.environ.get('WORKFLOW', 'unknown')}\n"
              + ("\n".join(failed) + "\n" if failed else "")
              + f"執行紀錄：{os.environ.get('RUN_URL', '')}\n"
              + "儀表板：https://status.chi.qzz.io/"
          )
          body = json.dumps({"content": content[:1900], "allowed_mentions": {"parse": []}}).encode()
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "ChiStatus/1.0"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status < 200 or response.status >= 300:
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          print("Discord workflow-failure notification sent.")
          PY
