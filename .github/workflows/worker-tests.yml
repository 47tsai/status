name: Test Cloudflare trigger Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-trigger-worker.yml"
      - ".github/workflows/worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Worker authorization and dispatch
        run: node --experimental-default-type=module --test worker/index.test.mjs

      - name: Validate Wrangler configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.toml
