name: Deploy Cloudflare trigger Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-trigger-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-chi-status-trigger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Worker authorization and dispatch
        run: node --experimental-default-type=module --test worker/index.test.mjs

      - name: Validate Wrangler configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.toml

      - name: Validate required secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATUS_WORKFLOW_TOKEN: ${{ secrets.STATUS_WORKFLOW_TOKEN }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STATUS_WORKFLOW_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Deploy Worker and configure GitHub API token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATUS_WORKFLOW_TOKEN: ${{ secrets.STATUS_WORKFLOW_TOKEN }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config worker/wrangler.toml 2>&1 | tee /tmp/wrangler-deploy.log
          printf '%s' "$STATUS_WORKFLOW_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN --config worker/wrangler.toml
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 | sed 's/[),.]$//')"
          {
            echo "## Cloudflare Worker deployment"
            if [ -n "$WORKER_URL" ]; then
              echo "Deployment URL: $WORKER_URL"
              echo
              echo "Worker deployed and GitHub API token configured. If the Worker URL changes, update API_URL in actions/index.html."
            else
              echo "Worker deployed and GitHub API token configured, but Wrangler's URL could not be parsed. See the deployment logs for the workers.dev URL."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
